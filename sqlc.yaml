version: "2"
sql:
  - engine: "postgresql"
    queries: "internal/store/queries/"
    schema: "internal/store/migrations/"
    gen:
      go:
        package: "dbgen"
        out: "internal/store/dbgen"
        sql_package: "database/sql"
        emit_json_tags: true
        emit_empty_slices: true
        emit_pointers_for_null_types: true
        overrides:
          - db_type: "uuid"
            go_type:
              import: "github.com/google/uuid"
              type: "UUID"
          - db_type: "jsonb"
            go_type:
              import: "encoding/json"
              type: "RawMessage"
          - db_type: "member_role"
            go_type: "string"
          - db_type: "scan_status"
            go_type: "string"
          - db_type: "cvss_version"
            go_type: "string"
          - db_type: "malware_type"
            go_type: "string"
          - db_type: "notification_status"
            go_type: "string"
          - db_type: "integration_type"
            go_type: "string"
          - db_type: "secret_status"
            go_type: "string"