# Hibou Server Configuration
# Copy to hibou-server.yaml and customize.
# Environment variables (HIBOU_*) override file values.

# Server
host: 0.0.0.0
port: 8585

# Explicit local-development opt-in. Leave unset or false in production.
# development: true

# MCP server
mcp:
  enabled: true
  port: 8081

# Public URL (used for cookie domain, OAuth callbacks)
# base:
#   url: https://hibou.example.com

# Database
database:
  url: postgres://hibou:hibou@localhost:5432/hibou?sslmode=disable

# Logging
log:
  level: info
  format: console

# Trivy server
trivy:
  url: http://localhost:4954

# OSV API
osv:
  url: https://api.osv.dev

# Advisory cache TTL
cache:
  ttl: 6h

# Artifact storage path
artifact:
  path: /data/artifacts

# Immediate request/webhook path work.
# Keep low-latency checks such as push-time secret scanning here instead of
# moving them onto delayed worker loops.
secret_scan:
  enabled: false
  providers: []
  temp_dir: ""
  on_push: false

# CVE Program feed (ADR-028) — watch products whose advisories name a version
# range but no package, and map them to packages by hand.
#
# Always on, and there is no working directory to set. The sweeper keeps a
# blobless shallow clone of the CVE list in a derived temporary path: commit and
# tree objects only, no file contents, so it stays under 10 MB rather than the
# 2.6 GB a full clone would cost. Records are fetched on demand, roughly 7 KB
# each, and only when they change.
#
# Nothing there is worth keeping — the resume point lives in the database — so a
# pod that loses it re-clones in seconds. Under Kubernetes the path follows
# TMPDIR into the chart's size-limited scratch volume; the root filesystem is
# read-only, so it must not land in the container layer.
#
# The corpus seeds itself. On its first sweep the server resolves the remote's
# current commit, streams the whole corpus at it (~382,000 records; a 300 MB
# throwaway clone, no working tree, removed afterwards), and resumes from that
# same commit. Expect ~15 minutes, once. There is nothing to enable and no
# command to run.
cve_feed:
  # The repository to sweep AND to seed from. Defaults to the public cvelistV5
  # list; point it at an internal mirror for an instance with no outbound
  # internet:
  #
  #   remote: "https://git.internal/mirrors/cvelistV5.git"
  #
  # Everything follows this — resolving the commit, seeding the corpus, and
  # reading changed records — so a mirror needs no other configuration. Keep it
  # synced from upstream on whatever schedule suits; the sweep reports whatever
  # the mirror has moved to.
  remote: ""
  # Upstream commits ~2.8 times an hour; polling faster only costs requests.
  interval: 15m

# Known-exploited-vulnerabilities catalogs, mirrored locally. A listed
# vulnerability means the publisher has evidence of active exploitation; the
# quality gate blocks a PR that introduces one unconditionally, regardless of
# CVSS, and the finding detail carries the listing. Waiving the finding remains
# the way to merge past it.
#
# Both catalogs are mirrored by default with nothing to configure. Sync state
# (per source: last sync, entry count, what has been failing since when) is on
# the advisory activity endpoint next to the CVE feed's health.
kev:
  # Master switch for the whole sync loop. Disabling (here or per source)
  # PURGES that scope's stored rows: the gate genuinely stops blocking on
  # exploited catalogs rather than freezing on stale ones nobody refreshes.
  enabled: true
  # Both catalogs update a few times a week; hours is the right unit.
  interval: 6h
  # CISA KEV — the US catalog, and the richest one: it carries the listing
  # date, a remediation due date, and known-ransomware-campaign use.
  cisa:
    enabled: true
    # Defaults to CISA's published feed; point it at a mirror serving the same
    # JSON document for an instance with no outbound internet:
    #   https://www.cisa.gov/sites/default/files/feeds/known_exploited_vulnerabilities.json
    url: ""
  # ENISA EUVD exploited set — the EU catalog the CRA's coordinated disclosure
  # regime builds on. Walked through the EUVD search API.
  euvd:
    enabled: true
    # Defaults to https://euvdservices.enisa.europa.eu/api
    url: ""

# EPSS mirror (ADR-038): FIRST's daily exploit-prediction scores, shown beside
# CVSS and used by the Risk sort and epss: filters. A ~3 MB download a day.
epss:
  enabled: true
  # A new file is published daily; checking more often only re-reads it.
  interval: 24h
  # Defaults to https://epss.empiricalsecurity.com/epss_scores-current.csv.gz;
  # point it at a mirror serving the same gzipped CSV for an instance with no
  # outbound internet.
  url: ""

# Prometheus /metrics (ADR-039). With port 0 it is served on the application
# port, so anything that can reach hibou can read it. Give it its own port (not
# forwarded by your ingress), a bearer token, or both.
metrics:
  enabled: true  # false serves /metrics nowhere
  port: 0
  # bearer_token: ""
  # bearer_token_file: /run/secrets/hibou-metrics-token  # wins over bearer_token

# Storage usage sampler (ADR-039): Postgres sizes/health and the artifact
# ledger, exported on /metrics. Usage only, no prices: join cost outside hibou.
storage_usage:
  enabled: true
  interval: 15m
  # Lists the artifact backend to find what it actually holds (orphans).
  # On S3 each 1,000 keys is a billed LIST request, hence opt-in.
  inventory:
    enabled: false
    interval: 24h
    max_objects: 1000000


# Delayed background loops.
# Leave enabled for a single combined deployment. Disable on API-only pods and
# enable on dedicated worker pods when you split roles.
background:
  artifact_processing:
    enabled: true
  retention:
    enabled: true
  stale_scan:
    enabled: true
  stale_pending:
    enabled: true

# Snapshot retention (ADR-014 resolved policy)
retention:
  preset: envelope
  keep_all: 14d
  storage:
    budget: 5GB
    warn_at: 80%
    target: 85%
    evict_order: spread
  tiers:
    enabled: true
    week_anchor: friday
    representative: last
    daily:
      keep: 30
    weekly:
      keep: 26
    monthly:
      keep: 12
    yearly:
      keep: 3
  on_thin:
    artifacts: purge
    summary: keep
  pin:
    tags: true
    latest_per_ref: true
    referenced_by_open_findings: true
    labels:
      - baseline
      - audit
  pr:
    keep_all: 7d
    after_close: purge
  failed_retention: 7d
  auto_purge: false
  dry_run: false

# Max upload size in bytes (default: 100 MiB)
max:
  upload:
    size: 104857600

# Session secret (production is strict by default: set a stable random value before production)
# Local development may opt in with development: true or HIBOU_DEVELOPMENT=true.
# Use the same value on every replica. Rotating it invalidates existing
# hibou_session and hibou_oauth_state cookies and forces users to log in again.
# session:
#   secret: your-secure-secret-here

# Instance administrators (case-insensitive emails). Instance admins manage
# instance-wide settings (announcement banners, instance audit); the role is
# distinct from org/repo admin membership. Prefer admins_file
# (HIBOU_INSTANCE_ADMINS_FILE) in production: point it at a mounted Secret —
# it is re-read on every check, so edits apply live and no email lands in git.
# List changes are recorded in the instance audit log either way.
# instance:
#   admins_file: /etc/hibou/instance-admins/emails
#   admins: "admin@example.com,ops@example.com"

# Forge configuration uses indexed environment variables:
#   HIBOU_FORGE_0_TYPE=forgejo
#   HIBOU_FORGE_0_URL=http://localhost:3030
#   HIBOU_FORGE_0_CLIENT_ID=...
#   HIBOU_FORGE_0_CLIENT_SECRET=...
#   HIBOU_FORGE_0_WEBHOOK_SECRET=...
#   HIBOU_FORGE_0_TOKEN=...
#
# TOKEN is the forge API token the server authenticates its own calls with —
# commit statuses, PR comments, repository reads. The OAuth2 client credentials
# above only authenticate a user login, so a forge rejects an API write made
# with them. Read by forgejo forges; GitHub App forges mint installation tokens
# from APP_ID/PRIVATE_KEY instead and leave TOKEN empty.
