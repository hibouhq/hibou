hibou:
  image:
    repository: ghcr.io/hibouhq/hibou
    # tag is expected to be managed by Argo CD Image Updater with sha-<short>.
    # The deploy-dogfood workflow is legacy/transitional.
    tag: ""
    pullPolicy: Always
  replicas: 1
  resources:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 1Gi
  logging:
    level: info
    format: json
  sessionSecretExistingSecret: hibou-session
  # Example GitHub App forge wiring.
  # Create Secret "hibou-forge-github" with env-style keys such as:
  #   HIBOU_FORGE_0_TYPE=github
  #   HIBOU_FORGE_0_ID=github
  #   HIBOU_FORGE_0_CLIENT_ID=<github-app-client-id>
  #   HIBOU_FORGE_0_CLIENT_SECRET=<github-app-client-secret>
  #   HIBOU_FORGE_0_WEBHOOK_SECRET=<github-webhook-secret>
  #   HIBOU_FORGE_0_APP_ID=<github-app-id>
  #   HIBOU_FORGE_0_PRIVATE_KEY=<pem-private-key>
  #   HIBOU_FORGE_0_IP_ALLOWLIST=true
  # forges:
  #   - type: github
  #     id: github
  #     existingSecret: hibou-forge-github

postgresql:
  enabled: true
  auth:
    existingSecret: hibou-db-url
    username: hibou
    database: hibou
  persistence:
    enabled: false
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 1Gi

trivy:
  enabled: true
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

ingress:
  enabled: true
  hostname: hibouhq.com
  className: traefik
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
  path: /
  pathType: Prefix
  tls:
    enabled: true
    existingSecret: ""
