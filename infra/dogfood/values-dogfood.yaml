hibou:
  image:
    repository: ghcr.io/hibouhq/hibou
    # tag is expected to be managed by Argo CD Image Updater with sha-<short>.
    # The deploy-dogfood workflow is legacy/transitional.
    tag: ""
    pullPolicy: Always
  replicas: 1
  resources:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      cpu: "1"
      # GOMEMLIMIT is derived from this (80%, hibou.goMemLimitPercent).
      memory: 1536Mi
  # Below Cloudflare's 100 MB request-body cap, so oversized uploads get a
  # clear 413 from Hibou instead of an opaque proxy error. 85 MiB.
  maxUploadSize: "89128960"
  # The MCP listener is plain HTTP on all interfaces; nothing on dogfood uses it.
  mcp:
    enabled: false
  # Public instance: expired data is actually deleted, not just reported.
  retention:
    autoPurge: "true"
  # Default-deny for hibou pods. k3s enforces NetworkPolicy (embedded
  # kube-router) and runs Traefik in kube-system, the chart default for
  # ingressFrom. Bundled Postgres / SeaweedFS / Trivy are in-namespace.
  networkPolicy:
    enabled: true
  logging:
    level: info
    format: json
  # Enable ONLY once the instance is reachable exclusively through Cloudflare
  # (tunnel, or a security group limited to Cloudflare ranges). Trusting
  # CF-Connecting-IP while clients can still connect directly, or from any
  # Cloudflare address (Workers), lets a caller choose its own client IP:
  # rate limits, the audit IP and the webhook IP allowlist then lie.
  # Without it, every client shares the edge IP the ingress sees.
  # Ranges from https://www.cloudflare.com/ips/ (checked 2026-10-12).
  # trustedProxy:
  #   header: CF-Connecting-IP
  #   cidrs:
  #     - 173.245.48.0/20
  #     - 103.21.244.0/22
  #     - 103.22.200.0/22
  #     - 103.31.4.0/22
  #     - 141.101.64.0/18
  #     - 108.162.192.0/18
  #     - 190.93.240.0/20
  #     - 188.114.96.0/20
  #     - 197.234.240.0/22
  #     - 198.41.128.0/17
  #     - 162.158.0.0/15
  #     - 104.16.0.0/13
  #     - 104.24.0.0/14
  #     - 172.64.0.0/13
  #     - 131.0.72.0/22
  #     - 2400:cb00::/32
  #     - 2606:4700::/32
  #     - 2803:f800::/32
  #     - 2405:b500::/32
  #     - 2405:8100::/32
  #     - 2a06:98c0::/29
  #     - 2c0f:f248::/32
  sessionSecretExistingSecret: hibou-session
  # Deliberately on: sign-in is restricted to allowedOrgs below.
  autoProvisionOrgs: true
  # The instance is public once the code is: only hibouhq members may sign in.
  auth:
    allowedOrgs: [hibouhq]
  # Instance admins (announcement banners, instance settings, instance audit).
  # The list lives in a Secret (never in git) and is re-read live — edit it with:
  #   kubectl create secret generic hibou-instance-admins \
  #     --from-literal=emails="<email1>,<email2>" \
  #     --dry-run=client -o yaml | kubectl apply -f -
  # Changes apply within ~1 minute, no restart needed.
  instanceAdminsExistingSecret: hibou-instance-admins
  # Example GitHub forge wiring.
  # Create Secret "hibou-forge-github" with env-style keys such as:
  #   HIBOU_FORGE_0_TYPE=github
  #   HIBOU_FORGE_0_ID=github
  #   HIBOU_FORGE_0_CLIENT_ID=<github-oauth-client-id>
  #   HIBOU_FORGE_0_CLIENT_SECRET=<github-oauth-client-secret>
  #   HIBOU_FORGE_0_WEBHOOK_SECRET=<github-webhook-secret>
  #   HIBOU_FORGE_0_APP_ID=<optional-github-app-id>
  #   HIBOU_FORGE_0_PRIVATE_KEY=<optional-pem-private-key>
  #   HIBOU_FORGE_0_IP_ALLOWLIST=true
  forges:
    - type: github
      id: github
      existingSecret: hibou-forge-github

  # Secret scanning on the single combined pod: dogfood has no dedicated
  # worker, so opt in explicitly — scratch gives the read-only-rootfs pod a
  # bounded place to clone, background.secretScan runs the loop here.
  secretScan:
    enabled: true
    onPush: true
  background:
    secretScan: true
  scratch:
    enabled: true
    sizeLimit: 5Gi

artifact:
  backend: s3

seaweedfs:
  enabled: true
  bucket: hibou-artifacts
  storage:
    # Use a retained/block-backed StorageClass for dogfood. The cluster default
    # on single-node k3s is often node-local and disappears with instance rebuilds.
    storageClass: ""
    size: 10Gi

postgresql:
  enabled: true
  auth:
    existingSecret: hibou-db-url
    username: hibou
    database: hibou
  persistence:
    # Persistent storage is REQUIRED: with emptyDir, a pod restart wipes the
    # database (orgs, users, scan history) and disconnects all forge orgs.
    enabled: true
    # Set this to a retained/block-backed StorageClass for dogfood. Leaving it
    # empty uses the cluster default, which may be node-local and not survive
    # instance replacement.
    storageClass: ""
    size: 4Gi
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 1Gi

trivy:
  enabled: true
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

ingress:
  enabled: true
  hostname: dogfood.hibouhq.com
  className: traefik
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
  path: /
  pathType: Prefix
  tls:
    enabled: true
    existingSecret: ""
