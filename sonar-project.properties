sonar.projectKey=hibouhq_hibou
sonar.organization=hibouhq

sonar.sources=.
sonar.exclusions=\
  **/node_modules/**,\
  **/dist/**,\
  **/vendor/**,\
  internal/store/dbgen/**,\
  internal/apidoc/**,\
  site/coverage/**,\
  **/*.pb.go

sonar.tests=.
sonar.test.inclusions=**/*_test.go,site/src/**/*.test.*,site/src/**/*.spec.*
sonar.coverage.exclusions=**/*_test.go,internal/store/dbgen/**,internal/apidoc/**

# Go coverage (gocover format)
sonar.go.coverage.reportPaths=coverage.out

# Frontend coverage (lcov)
sonar.javascript.lcov.reportPaths=site/coverage/lcov.info
sonar.typescript.lcov.reportPaths=site/coverage/lcov.info

sonar.sourceEncoding=UTF-8
