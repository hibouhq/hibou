contents:
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
  repositories:
    - https://packages.wolfi.dev/os
  packages:
    - ca-certificates-bundle
    - tzdata
    - wolfi-baselayout
    # Secret scanning: gitleaks scans, git clones. betterleaks comes from the
    # Dockerfile (not packaged in wolfi).
    #
    # NO SHELL IN THIS IMAGE — deliberate. Verified with strace: gitleaks execs
    # only `git`, betterleaks execs nothing (pure go-git), and our own
    # `git clone https://…` uses the remote transport (git-remote-https). None
    # need /bin/sh. TruffleHog is the sole exception: it re-clones the checkout
    # we hand it via a file:// URI, and git's LOCAL transport execs
    # "git-upload-pack '<path>'" through a shell. Rather than add busybox to a
    # security scanner's image for one engine, trufflehog stays disabled
    # (internal/server/secret_scan_processing.go) and is not shipped here.
    #
    # Scanner pins use =~ (apk fuzzy match): renovate tracks the upstream
    # release, while the wolfi -rX rebuild suffix floats — no renovate
    # datasource can see it. A bump wolfi hasn't packaged yet fails `apko
    # lock`/build loudly on the renovate PR instead of drifting silently.
    - git
    # renovate: datasource=github-releases depName=gitleaks/gitleaks extractVersion=^v(?<version>.+)$
    - gitleaks=~8.30.1

accounts:
  groups:
    - groupname: nonroot
      gid: 65532
  users:
    - username: nonroot
      uid: 65532
      gid: 65532
  run-as: 65532

archs:
  - amd64
  - arm64

# Minimal entrypoint — overridden by Dockerfile ENTRYPOINT anyway.
entrypoint:
  command: /usr/local/bin/hibou-server

annotations:
  org.opencontainers.image.title: "hibou-base"
  org.opencontainers.image.description: "Minimal Wolfi base for Hibou static Go binary"
  org.opencontainers.image.source: "https://github.com/hibouhq/hibou"
