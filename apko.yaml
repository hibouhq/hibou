contents:
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
  repositories:
    - https://packages.wolfi.dev/os
  packages:
    - ca-certificates-bundle
    - tzdata
    - wolfi-baselayout
    # Secret scanning: gitleaks + trufflehog scan, git clones (providers exec
    # all three). TruffleHog is AGPL-3.0: shipped as a separate binary in the
    # image (mere aggregation), never linked or embedded.
    #
    # Scanner pins use =~ (apk fuzzy match): renovate tracks the upstream
    # release, while the wolfi -rX rebuild suffix floats — no renovate
    # datasource can see it. A bump wolfi hasn't packaged yet fails `apko
    # lock`/build loudly on the renovate PR instead of drifting silently.
    - git
    # renovate: datasource=github-releases depName=gitleaks/gitleaks extractVersion=^v(?<version>.+)$
    - gitleaks=~8.30.1
    # renovate: datasource=github-releases depName=trufflesecurity/trufflehog extractVersion=^v(?<version>.+)$
    - trufflehog=~3.95.5

accounts:
  groups:
    - groupname: nonroot
      gid: 65532
  users:
    - username: nonroot
      uid: 65532
      gid: 65532
  run-as: 65532

archs:
  - amd64
  - arm64

# Minimal entrypoint — overridden by Dockerfile ENTRYPOINT anyway.
entrypoint:
  command: /usr/local/bin/hibou-server

annotations:
  org.opencontainers.image.title: "hibou-base"
  org.opencontainers.image.description: "Minimal Wolfi base for Hibou static Go binary"
  org.opencontainers.image.source: "https://github.com/hibouhq/hibou"
