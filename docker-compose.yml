services:
  postgres:
    image: postgres:16
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: hibou
      POSTGRES_PASSWORD: hibou
      POSTGRES_DB: hibou
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 10s
      timeout: 5s
      retries: 5

  trivy:
    image: aquasec/trivy:latest
    command: ['server', '--listen', '0.0.0.0:4954']
    ports:
      - '4954:4954'

volumes:
  postgres-data: