services:
  postgres:
    image: postgres:18
    # The full `go test ./...` run opens one pool per DB-backed package; the
    # default 100 connections trips "too many clients" flakes.
    command: postgres -c max_connections=300
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: hibou
      POSTGRES_PASSWORD: hibou
      POSTGRES_DB: hibou
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 10s
      timeout: 5s
      retries: 5

  forgejo:
    image: codeberg.org/forgejo/forgejo:9
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    ports:
      - '3030:3000'
      - '2222:22'
    environment:
      FORGEJO__database__DB_TYPE: sqlite3
      FORGEJO__server__ROOT_URL: http://localhost:3030
      FORGEJO__server__DOMAIN: localhost
      FORGEJO__server__HTTP_PORT: '3000'
      FORGEJO__service__DISABLE_REGISTRATION: 'false'
      FORGEJO__service__REQUIRE_SIGNIN_VIEW: 'false'
      FORGEJO__oauth2__ENABLE: 'true'
    volumes:
      - forgejo-data:/data
    healthcheck:
      test: ['CMD', 'curl', '-fsSo', '/dev/null', 'http://localhost:3000/api/v1/version']
      interval: 10s
      timeout: 5s
      retries: 10

  trivy:
    image: aquasec/trivy:latest
    command: ['server', '--listen', '0.0.0.0:4954']
    ports:
      - '4954:4954'
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1:4954/healthz']
      interval: 5s
      timeout: 3s
      start_period: 5m
      retries: 12

volumes:
  postgres-data:
  forgejo-data:
