name: Deploy Docs

on:
  push:
    branches: [main]
    tags:
      - "v*"
    paths:
      - "docs/**"
      - ".github/workflows/docs.yml"
      - "scripts/docs/**"
      - "internal/repoconfig/hibou-config.schema.json"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to deploy (e.g., v0.1.0 or latest)"
        required: false
        default: "latest"

# One deployment at a time across all refs: each run extends the previous
# run's site, so a main push and a tag deploying in parallel would drop each
# other's version.
concurrency:
  group: pages
  cancel-in-progress: false

permissions: {}

jobs:
  # Builds on the plain runner: the docs need only Node (and zip, which the
  # runner has). No write permission here, so third-party npm install scripts
  # never run next to a token that can publish the site or mint OIDC tokens.
  build:
    runs-on: ubuntu-latest
    permissions:
      actions: read # find and download the previous run's site
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Determine version
        id: version
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: scripts/docs/version.sh

      - name: Read Node version
        id: node
        run: scripts/docs/node-version.sh

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ steps.node.outputs.version }}
          cache: npm
          cache-dependency-path: docs/package-lock.json

      - name: Build docs
        env:
          DOCS_VERSION: ${{ steps.version.outputs.version }}
        run: scripts/docs/build.sh

      - name: Find previous site
        id: previous
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/docs/previous-run.sh

      - name: Download existing site
        if: steps.previous.outputs.run_id != ''
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: github-pages-current
          path: _site
          run-id: ${{ steps.previous.outputs.run_id }}
          github-token: ${{ github.token }}
        continue-on-error: true

      - name: Assemble versioned site
        env:
          VERSION: ${{ steps.version.outputs.version }}
          IS_LATEST: ${{ steps.version.outputs.is_latest }}
        run: scripts/docs/assemble-site.sh

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4.0.0
        with:
          path: _site

      - name: Save site state for future builds
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: github-pages-current
          path: _site
          retention-days: 90
          overwrite: true

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
