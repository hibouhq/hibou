name: Deploy Docs

on:
  push:
    branches: [main]
    tags:
      - "v*"
    paths:
      - "docs/**"
      - ".github/workflows/docs.yml"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to deploy (e.g., v0.1.0 or latest)"
        required: false
        default: "latest"

# Allow only one concurrent deployment per version
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0

      - name: Determine version
        id: version
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          if [[ "${REF_TYPE}" == "tag" ]]; then
            if [[ ! "${REF_NAME}" =~ ^v[0-9]+\.[0-9]+ ]]; then
              echo "::error::Unexpected tag name: ${REF_NAME}"
              exit 1
            fi
            VERSION=$(echo "${REF_NAME}" | sed -E 's/^(v[0-9]+\.[0-9]+).*/\1/')
            echo "version=$VERSION" >> "$GITHUB_OUTPUT"
            echo "is_latest=false" >> "$GITHUB_OUTPUT"
          elif [[ -n "${INPUT_VERSION}" && "${INPUT_VERSION}" != "latest" ]]; then
              # Sanitize: only allow semver-like patterns (v1.0, v1.0.0, etc.)
              if [[ ! "${INPUT_VERSION}" =~ ^v?[0-9]+(\.[0-9]+){0,2}$ ]]; then
                echo "::error::Invalid version format: ${INPUT_VERSION}"
                exit 1
              fi
              echo "version=${INPUT_VERSION}" >> "$GITHUB_OUTPUT"
            echo "is_latest=false" >> "$GITHUB_OUTPUT"
          else
            echo "version=latest" >> "$GITHUB_OUTPUT"
            echo "is_latest=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build devcontainer
        uses: ./.github/actions/devcontainer-ci
        with:
          registry: ghcr.io

      - name: Build docs
        uses: ./.github/actions/devcontainer-ci
        # The version reaches the shell as data (env), never as interpolated
        # script text.
        env:
          DOCS_VERSION: ${{ steps.version.outputs.version }}
        with:
          run-cmd: |
            cd docs && npm ci
            DOCS_BASE="/${DOCS_VERSION}" \
            PUBLIC_DOCS_VERSION="${DOCS_VERSION}" \
            npm run build

      - name: Download existing site
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: github-pages-current
          path: _site
        continue-on-error: true

      - name: Assemble versioned site
        env:
          VERSION: ${{ steps.version.outputs.version }}
          IS_LATEST: ${{ steps.version.outputs.is_latest }}
        run: |
          mkdir -p _site

          # Copy built docs into version subdirectory
          rm -rf "_site/$VERSION"
          cp -r docs/dist "_site/$VERSION"

          # If this is a tag release, also deploy as "stable"
          if [[ "$IS_LATEST" == "false" ]]; then
            rm -rf _site/stable
            cp -r docs/dist _site/stable
          fi

          # Update versions.json
          if [[ -f _site/versions.json ]]; then
            # Add version if not present, ensure latest and stable are first
            jq --arg v "$VERSION" \
              'if (. | index($v)) then . else . + [$v] end' \
              _site/versions.json > _site/versions.tmp
            mv _site/versions.tmp _site/versions.json
          else
            echo '["stable", "latest"]' > _site/versions.json
            if [[ "$VERSION" != "latest" && "$VERSION" != "stable" ]]; then
              jq --arg v "$VERSION" '. + [$v]' _site/versions.json > _site/versions.tmp
              mv _site/versions.tmp _site/versions.json
            fi
          fi

          # Ensure "stable" is always in versions.json
          if ! jq -e '. | index("stable")' _site/versions.json > /dev/null 2>&1; then
            jq '. = ["stable"] + .' _site/versions.json > _site/versions.tmp
            mv _site/versions.tmp _site/versions.json
          fi

          # Root index.html redirects to /stable/
          cat > _site/index.html << 'EOF'
          <!DOCTYPE html>
          <html>
            <head>
              <meta charset="utf-8">
              <meta http-equiv="refresh" content="0; url=./stable/">
              <link rel="canonical" href="./stable/">
              <title>Redirecting to Hibou Docs</title>
            </head>
            <body>
              <p>Redirecting to <a href="./stable/">stable documentation</a>...</p>
            </body>
          </html>
          EOF

          echo "Site structure:"
          ls -la _site/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4.0.0
        with:
          path: _site

      - name: Save site state for future builds
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: github-pages-current
          path: _site
          retention-days: 90
          overwrite: true

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
