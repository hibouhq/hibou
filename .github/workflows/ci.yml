name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  release:
    types: [published]

jobs:
  ci:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Log in to GHCR
        if: github.event_name != 'pull_request' || !github.event.pull_request.head.repo.fork
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push devcontainer
        uses: ./.github/actions/devcontainer-ci
        with:
          registry: ghcr.io
          push-pr-cache: ${{ github.event_name != 'pull_request' || !github.event.pull_request.head.repo.fork }}

      - name: Build and test
        uses: ./.github/actions/devcontainer-ci
        with:
          run-cmd: |
            (cd site && npm ci)
            make check-generate
            make build-all
            .github/scripts/parallel-run.sh \
              "lint"      "make lint" \
              "coverage"  "make coverage" \
              "frontend"  "(cd site && npm run coverage)"
            make check-reproducible

      - name: Run gosec
        uses: ./.github/actions/devcontainer-ci
        with:
          run-cmd: gosec -fmt sarif -out gosec.sarif ./... || true

      - name: SonarCloud scan
        uses: SonarSource/sonarcloud-github-action@v3
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          format: sarif
          output: trivy-fs.sarif

      - name: Generate Go SBOM
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: cyclonedx
          output: go-sbom.cdx.json

      - name: Generate frontend SBOM
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: site/
          format: cyclonedx
          output: frontend-sbom.cdx.json

      - name: Check Hibou upload config
        id: hibou-ci
        run: |
          if [[ -n "$HIBOU_SERVER_URL" && -n "$HIBOU_API_TOKEN" ]]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          HIBOU_SERVER_URL: ${{ secrets.HIBOU_SERVER_URL }}
          HIBOU_API_TOKEN: ${{ secrets.HIBOU_API_TOKEN }}

      - name: Upload to Hibou
        if: steps.hibou-ci.outputs.enabled == 'true'
        continue-on-error: true
        uses: ./.github/actions/hibou-upload
        with:
          expect: 2
          server: ${{ secrets.HIBOU_SERVER_URL }}
          token: ${{ secrets.HIBOU_API_TOKEN }}
          file: |
            coverage.out
            site/coverage/lcov.info
            gosec.sarif
            trivy-fs.sarif
            go-sbom.cdx.json
            frontend-sbom.cdx.json

      - name: Upload security artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-reports
          path: |
            gosec.sarif
            trivy-fs.sarif
            go-sbom.cdx.json
            frontend-sbom.cdx.json
          retention-days: 30

      - name: Upload build artifacts
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: binaries
          path: |
            dist/hibou-darwin-arm64
            dist/hibou-linux-amd64
            dist/hibou-linux-arm64
            dist/hibou-windows-amd64.exe
            dist/hibou-windows-arm64.exe

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Download pre-built binaries
        uses: actions/download-artifact@v4
        with:
          name: binaries
          path: dist/

      - name: Upload release artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          gh release upload "${REF_NAME}" \
            dist/hibou-darwin-arm64 \
            dist/hibou-linux-amd64 \
            dist/hibou-linux-arm64 \
            dist/hibou-windows-amd64.exe \
            dist/hibou-windows-arm64.exe \
            --clobber

      - name: Get commit timestamp
        id: commit
        run: echo "epoch=$(git log -1 --format=%ct)" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build devcontainer
        uses: ./.github/actions/devcontainer-ci
        with:
          registry: ghcr.io

      - name: Publish apko base image
        uses: ./.github/actions/devcontainer-ci
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
          REPO: ${{ github.repository }}
          REF_NAME: ${{ github.ref_name }}
        with:
          run-cmd: |
            echo "${GITHUB_TOKEN}" | apko login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin
            base_ref="ghcr.io/${REPO}-base:${REF_NAME}"
            apko publish --lockfile apko.lock.json apko.yaml "${base_ref}"
            echo "${base_ref}" > .apko-base-ref

      - name: Read apko base ref
        id: base
        run: |
          echo "ref=$(cat .apko-base-ref)" >> "$GITHUB_OUTPUT"
          rm -f .apko-base-ref

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push multi-arch image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            SOURCE_DATE_EPOCH=${{ steps.commit.outputs.epoch }}
            BASE_IMAGE=${{ steps.base.outputs.ref }}

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign image
        run: |
          while IFS= read -r tag; do
            [[ -z "$tag" ]] && continue
            cosign sign --yes "${tag}"
          done <<< "$TAGS"
        env:
          TAGS: ${{ steps.meta.outputs.tags }}

      - name: Generate image SBOM and scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: ${{ fromJSON(steps.meta.outputs.json).tags[0] }}
          format: cyclonedx
          output: image-sbom.cdx.json

      - name: Check Hibou upload config
        id: hibou
        run: |
          if [[ -n "$HIBOU_SERVER_URL" && -n "$HIBOU_API_TOKEN" ]]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          HIBOU_SERVER_URL: ${{ secrets.HIBOU_SERVER_URL }}
          HIBOU_API_TOKEN: ${{ secrets.HIBOU_API_TOKEN }}

      - name: Upload image SBOM to Hibou
        if: steps.hibou.outputs.enabled == 'true'
        continue-on-error: true
        uses: ./.github/actions/hibou-upload
        with:
          expect: 2
          server: ${{ secrets.HIBOU_SERVER_URL }}
          token: ${{ secrets.HIBOU_API_TOKEN }}
          file: image-sbom.cdx.json

      - name: Publish Helm chart
        uses: ./.github/actions/devcontainer-ci
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
          REPO_OWNER: ${{ github.repository_owner }}
          REF_NAME: ${{ github.ref_name }}
        with:
          run-cmd: |
            echo "${GITHUB_TOKEN}" | helm registry login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin
            version="${REF_NAME#v}"
            sed -i "s/^version:.*/version: ${version}/" chart/hibou/Chart.yaml
            sed -i "s/^appVersion:.*/appVersion: ${version}/" chart/hibou/Chart.yaml
            helm repo add cloudnative-pg https://cloudnative-pg.github.io/charts --force-update
            helm repo update
            helm dependency build chart/hibou
            helm package chart/hibou --destination /tmp
            helm push "/tmp/hibou-${version}.tgz" "oci://ghcr.io/${REPO_OWNER}/charts"
