name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  release:
    types: [published]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    runs-on: ubuntu-latest
    # One job so the devcontainer is built once. Publishing steps are skipped
    # for every pull request; pull requests from forks also get a read-only
    # token and no secrets from GitHub itself.
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false

      # Every `uses: ./.github/actions/...` after a container step loads its
      # action.yml from the workspace, which the devcontainer has mounted
      # read-write. Record .github and .devcontainer now, before any container
      # step, outside the workspace; each "Verify workflow files are unchanged"
      # step below compares against it before the host loads a local action
      # again. Plain find/sha256sum, not git: host git would read .git/config,
      # which the container can also write (core.fsmonitor runs a command).
      # This catches workspace tampering, not a container escape: the
      # devcontainer is privileged (docker-in-docker). See THREAT-MODEL.md,
      # "CI and release trust".
      - name: Record workflow files
        run: find .github .devcontainer -printf '%y %m %p %l\n' -type f -exec sha256sum {} + | LC_ALL=C sort > "${RUNNER_TEMP}/workspace-trust.manifest"

      # Read from git before any container step can touch .git.
      - name: Get commit info
        if: github.event_name != 'pull_request'
        id: commit
        run: |
          echo "epoch=$(git log -1 --format=%ct)" >> "$GITHUB_OUTPUT"
          echo "short_sha=${GITHUB_SHA:0:7}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        if: github.event_name != 'pull_request' || !github.event.pull_request.head.repo.fork
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - parallel:
          - name: Free disk space
            run: .github/scripts/free-disk-space.sh

          # The action pushes the image and cache only for a push event to the
          # exact default-branch ref (never a pull request, never a branch
          # name that merely sanitizes to "main").
          - name: Build and push devcontainer
            uses: ./.github/actions/devcontainer-ci
            with:
              registry: ghcr.io

      - name: Prepare workspace
        uses: ./.github/actions/devcontainer-ci
        with:
          run-cmd: |
            (cd site && npm ci)
            make check-generate
            # Warm the shared Go build cache once, uncontended. golangci-lint,
            # go test and gosec all load the same package graph; without this
            # each compiles the dependencies from cold while fighting the
            # others for the same two cores.
            go build ./...

      - name: Verify workflow files are unchanged
        run: diff "${RUNNER_TEMP}/workspace-trust.manifest" <(find .github .devcontainer -printf '%y %m %p %l\n' -type f -exec sha256sum {} + | LC_ALL=C sort) || { echo "::error::.github or .devcontainer changed since checkout"; exit 1; }

      # Two waves of two, not one wave of five.
      #
      # `ubuntu-latest` on a private repo is 2 vCPU / 7 GB. The previous
      # five-way fan-out oversubscribed it ~3x, and the three Go-heavy branches
      # spent most of their time waiting rather than working: lint 11m16s
      # (blew its 10m deadline), Go coverage 9m16s, security suite 9m05s —
      # roughly 10 core-minutes of real work stretched over 11 wall-minutes.
      #
      # Same work, two at a time, so each branch gets a core.
      - parallel:
          - name: Lint
            uses: ./.github/actions/devcontainer-ci
            with:
              run-cmd: make lint

          - name: Build binaries and frontend coverage
            uses: ./.github/actions/devcontainer-ci
            with:
              # GENERATE_DEP= skips the `generate` prerequisite: Prepare
              # already ran check-generate (regenerate + assert clean), and
              # regenerating again HERE races the parallel Lint step —
              # `sqlc diff` reads dbgen/ while this step rewrites it in
              # place, failing Lint with a whole-file phantom diff.
              run-cmd: |
                if [ "${GITHUB_EVENT_NAME}" = "release" ]; then
                  make build-all GENERATE_DEP=
                else
                  make build-image-binaries GENERATE_DEP=
                fi
                (cd site && npm run coverage -- --reporter=default --reporter=junit --outputFile=junit-front.xml)

      - name: Verify workflow files are unchanged
        run: diff "${RUNNER_TEMP}/workspace-trust.manifest" <(find .github .devcontainer -printf '%y %m %p %l\n' -type f -exec sha256sum {} + | LC_ALL=C sort) || { echo "::error::.github or .devcontainer changed since checkout"; exit 1; }

      # Copy the binaries out of the workspace as soon as they are built, so no
      # later container step can swap them: the host runs hibou-linux-amd64
      # (Hibou upload), and a release checksums, signs and publishes the copies.
      - name: Snapshot built binaries
        env:
          IS_RELEASE: ${{ github.event_name == 'release' }}
        run: |
          set -euo pipefail
          out="${RUNNER_TEMP}/dist"
          mkdir -p "${out}"
          bins=(hibou-linux-amd64)
          if [ "${IS_RELEASE}" = "true" ]; then
            bins=(hibou-darwin-arm64 hibou-linux-amd64 hibou-linux-arm64 hibou-windows-amd64.exe hibou-windows-arm64.exe)
          fi
          for b in "${bins[@]}"; do
            [ -f "dist/${b}" ] && [ ! -L "dist/${b}" ] || { echo "::error::dist/${b} missing or not a regular file"; exit 1; }
            install -m 0755 "dist/${b}" "${out}/${b}"
          done
          (cd "${out}" && sha256sum "${bins[@]}" | tee SHA256SUMS)

      - parallel:
          - name: Go coverage
            uses: ./.github/actions/devcontainer-ci
            with:
              # NOTE: no Postgres here by explicit decision (runner resources are
              # tight), so the DB-backed tests skip in CI. They must be run
              # locally before shipping: `docker compose up -d postgres && make test`.
              run-cmd: make coverage

          - name: Security suite
            uses: ./.github/actions/devcontainer-ci
            with:
              run-cmd: |
                set -euo pipefail
                node --test scripts/sbom-license.test.mjs
                gosec -track-suppressions -fmt sarif -out gosec.sarif ./... || true
                trivy fs --format sarif --output trivy-fs.sarif .
                trivy fs --skip-db-update --format cyclonedx --output go-sbom.cdx.json .
                node scripts/sbom-license.mjs go-sbom.cdx.json go "${GITHUB_SHA}"
                trivy fs --skip-db-update --format cyclonedx --output frontend-sbom.cdx.json site/
                node scripts/sbom-license.mjs frontend-sbom.cdx.json frontend "${GITHUB_SHA}"

      - name: Verify workflow files are unchanged
        run: diff "${RUNNER_TEMP}/workspace-trust.manifest" <(find .github .devcontainer -printf '%y %m %p %l\n' -type f -exec sha256sum {} + | LC_ALL=C sort) || { echo "::error::.github or .devcontainer changed since checkout"; exit 1; }

      # --- Publishing (push to main, or a published release; never a PR) ---

      - name: Build and push image
        if: github.event_name != 'pull_request'
        uses: ./.github/actions/devcontainer-ci
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
          REPO: ${{ github.repository }}
          SOURCE_DATE_EPOCH: ${{ steps.commit.outputs.epoch }}
          GITHUB_SHA: ${{ github.sha }}
          GIT_BRANCH: ${{ github.head_ref || github.ref_name }}
          GIT_TARGET_BRANCH: ${{ github.base_ref }}
          GIT_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          IS_RELEASE: ${{ github.event_name == 'release' && 'true' || 'false' }}
          REF_NAME: ${{ github.event.release.tag_name || github.ref_name }}
        with:
          run-cmd: |
            set -euo pipefail
            repo="${REPO,,}"

            # Publish apko base image. The runtime image is built FROM the
            # digest apko just pushed (its last stdout line), never from the
            # mutable apko-base tag.
            echo "${GITHUB_TOKEN}" | apko login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin
            BASE_IMAGE="$(apko publish --lockfile apko.lock.json apko.yaml "ghcr.io/${repo}-cache:apko-base" | tail -n1)"
            if [[ ! "${BASE_IMAGE}" =~ ^ghcr\.io/${repo}-cache@sha256:[0-9a-f]{64}$ ]]; then
              echo "ERROR: apko publish did not print a digest reference: '${BASE_IMAGE}'"
              exit 1
            fi
            export BASE_IMAGE

            # Start Docker daemon
            if ! docker info >/dev/null 2>&1; then
              sudo /usr/local/share/docker-init.sh
              docker info >/dev/null 2>&1 || { echo "ERROR: Docker daemon failed to start"; exit 1; }
            fi

            echo "${GITHUB_TOKEN}" | docker login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin
            # renovate: datasource=github-releases depName=moby/buildkit packageName=moby/buildkit
            BUILDKIT_VERSION='0.30.0'
            docker pull --quiet "moby/buildkit:v${BUILDKIT_VERSION}"
            docker buildx create --use --name multiarch --driver docker-container \
              --driver-opt="image=moby/buildkit:v${BUILDKIT_VERSION}"

            sanitize() { echo "$1" | sed 's/[^a-zA-Z0-9._-]/-/g'; }
            # sha-* tags (what the dogfood image updater deploys) and the
            # build cache are pushed only for a push to exactly refs/heads/main.
            # A release pushes its version tags and nothing else.
            if [ "${GITHUB_EVENT_NAME}" = "push" ] && [ "${GITHUB_REF}" = "refs/heads/main" ]; then
              export SHA_TAG="sha-${GITHUB_SHA:0:7}"
              export CACHE_PUSH=true
            else
              export SHA_TAG=""
              export CACHE_PUSH=false
            fi
            export REPO="ghcr.io/${repo}"
            export CACHE_REPO="ghcr.io/${repo}-cache"
            export GIT_BRANCH="$(sanitize "${GIT_BRANCH}")"
            export GIT_TARGET_BRANCH="$(sanitize "${GIT_TARGET_BRANCH}")"
            export GIT_DEFAULT_BRANCH="$(sanitize "${GIT_DEFAULT_BRANCH}")"
            if [ "${IS_RELEASE}" = "true" ]; then
              export INCLUDE_EXTRA_CLI_BINARIES=true
            else
              export INCLUDE_EXTRA_CLI_BINARIES=false
            fi
            export PUSH=true

            # On release, add semver tags
            if [ "${IS_RELEASE}" = "true" ]; then
              export RELEASE_VERSION="${REF_NAME#v}"
              if [[ "${RELEASE_VERSION}" != *-* ]]; then
                export STABLE_RELEASE=true
                highest=$(git tag -l 'v*' --sort=-v:refname | grep -Ev -- '-' | head -1)
                [ "${REF_NAME}" = "${highest}" ] && export LATEST=true
              fi
            fi

            # The metadata file carries the pushed index digest, which the
            # host signs and attests below.
            docker buildx bake -f docker-bake.hcl --metadata-file bake-metadata.json

      - name: Verify workflow files are unchanged
        if: github.event_name != 'pull_request'
        run: diff "${RUNNER_TEMP}/workspace-trust.manifest" <(find .github .devcontainer -printf '%y %m %p %l\n' -type f -exec sha256sum {} + | LC_ALL=C sort) || { echo "::error::.github or .devcontainer changed since checkout"; exit 1; }

      - name: Upload security artifacts
        if: always() && vars.UPLOAD_GITHUB_SECURITY_ARTIFACTS == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: security-reports
          path: |
            gosec.sarif
            trivy-fs.sarif
            go-sbom.cdx.json
            frontend-sbom.cdx.json
          retention-days: 30

      # --- Release-only steps ---

      - name: Compute release version
        if: github.event_name == 'release'
        id: release
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      # --- Signing and provenance (host only: the OIDC token never enters the devcontainer) ---

      # cosign keyless signing records the signer identity (this repository and
      # workflow) in the public Rekor log, so it is skipped while the repository
      # is private, like the GitHub attestations below.
      - name: Install cosign
        if: github.event_name != 'pull_request' && !github.event.repository.private
        uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3.9.1

      - name: Resolve image digest
        if: github.event_name != 'pull_request'
        id: image
        env:
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          digest="$(jq -r '.default["containerimage.digest"] // empty' bake-metadata.json)"
          if [[ ! "${digest}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::no image digest in bake-metadata.json"
            exit 1
          fi
          echo "name=ghcr.io/${REPO,,}" >> "$GITHUB_OUTPUT"
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"

      # Signs the pushed index: the release tags, or the sha-* tag on main.
      - name: Sign image
        if: github.event_name != 'pull_request' && !github.event.repository.private
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          DIGEST: ${{ steps.image.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"

      # GitHub artifact attestations require a public repository (or
      # Enterprise Cloud): skipped while private instead of failing the build.
      - name: Attest image provenance
        if: github.event_name != 'pull_request' && !github.event.repository.private
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.image.outputs.name }}
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true
          create-storage-record: false

      # SHA256SUMS was computed by "Snapshot built binaries", over the copies
      # taken before any later container step ran.
      - name: Sign release checksums
        if: github.event_name == 'release' && !github.event.repository.private
        working-directory: ${{ runner.temp }}/dist
        run: cosign sign-blob --yes --bundle SHA256SUMS.sigstore.json SHA256SUMS

      - name: Attest release binaries provenance
        if: github.event_name == 'release' && !github.event.repository.private
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: ${{ runner.temp }}/dist/SHA256SUMS

      # No --clobber: a release's assets are immutable; re-running against a
      # release that already has them fails instead of replacing them.
      # GH_REPO: gh does not consult the workspace's git remotes.
      - name: Upload release binaries
        if: github.event_name == 'release'
        working-directory: ${{ runner.temp }}/dist
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          REF_NAME: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          assets=(
            hibou-darwin-arm64
            hibou-linux-amd64
            hibou-linux-arm64
            hibou-windows-amd64.exe
            hibou-windows-arm64.exe
            SHA256SUMS
          )
          # Absent while the repository is private (signing skipped).
          [ -f SHA256SUMS.sigstore.json ] && assets+=(SHA256SUMS.sigstore.json)
          gh release upload "${REF_NAME}" "${assets[@]}"

      - name: Generate image SBOM
        if: github.event_name == 'release'
        uses: ./.github/actions/devcontainer-ci
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          DIGEST: ${{ steps.image.outputs.digest }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        with:
          # By digest: the image that was signed and attested, not whatever
          # the version tag points at by now.
          run-cmd: |
            set -euo pipefail
            trivy image --format cyclonedx --output image-sbom.cdx.json "${IMAGE}@${DIGEST}"
            node scripts/sbom-license.mjs image-sbom.cdx.json image "${RELEASE_VERSION}"

      - name: Verify workflow files are unchanged
        if: github.event_name == 'release'
        run: diff "${RUNNER_TEMP}/workspace-trust.manifest" <(find .github .devcontainer -printf '%y %m %p %l\n' -type f -exec sha256sum {} + | LC_ALL=C sort) || { echo "::error::.github or .devcontainer changed since checkout"; exit 1; }

      - name: Publish Helm chart
        if: github.event_name != 'pull_request'
        uses: ./.github/actions/devcontainer-ci
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
          REPO_OWNER: ${{ github.repository_owner }}
          REF_NAME: ${{ github.event.release.tag_name || github.ref_name }}
          GITHUB_SHA: ${{ github.sha }}
          SOURCE_DATE_EPOCH: ${{ steps.commit.outputs.epoch }}
        with:
          registry: ghcr.io
          run-cmd: |
            set -euo pipefail

            echo "${GITHUB_TOKEN}" | helm registry login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin
            echo "${GITHUB_TOKEN}" | oras login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin

            # Compute tags and versions
            sha_tag="sha-${GITHUB_SHA:0:7}"
            if [[ "${REF_NAME}" == v* ]]; then
              chart_version="${REF_NAME#v}"
              app_version="${REF_NAME#v}"
              tags="${chart_version}"
            else
              chart_version="0.0.0-${sha_tag}"
              app_version="${sha_tag}"
              tags="${chart_version}"
            fi
            created="$(date -u -d "@${SOURCE_DATE_EPOCH}" +%Y-%m-%dT%H:%M:%SZ)"

            # Build chart dependencies and package
            helm repo add cloudnative-pg https://cloudnative-pg.github.io/charts --force-update
            helm repo update
            helm dependency build chart/hibou
            chart_tmpdir="$(mktemp -d)"
            helm package chart/hibou --version "${chart_version}" --app-version "${app_version}" --destination "${chart_tmpdir}"
            chart_tgz="${chart_tmpdir}/hibou-${chart_version}.tgz"
            repo_owner="${REPO_OWNER,,}"
            chart_file="$(basename "${chart_tgz}")"

            # Build OCI config from packaged chart
            chart_show="$(helm show chart "${chart_tgz}")"
            chart_name="$(echo "${chart_show}" | grep '^name:' | awk '{print $2}')"
            chart_desc="$(echo "${chart_show}" | grep '^description:' | sed 's/^description: //')"
            chart_api="$(echo "${chart_show}" | grep '^apiVersion:' | awk '{print $2}')"
            config_file="helm-config.json"
            printf '{"name":"%s","version":"%s","description":"%s","apiVersion":"%s","appVersion":"%s"}' \
              "${chart_name}" "${chart_version}" "${chart_desc}" "${chart_api}" "${app_version}" \
              > "${chart_tmpdir}/${config_file}"

            # Push with oras: multiple tags + OCI annotations. The pushed
            # manifest digest is handed to the host step that signs it.
            chart_repo="ghcr.io/${repo_owner}/charts/${chart_name}"
            chart_digest="$(
              cd "${chart_tmpdir}"
              oras push "${chart_repo}:${tags}" --format go-template --template '{{.digest}}' \
                --config "${config_file}:application/vnd.cncf.helm.config.v1+json" \
                --annotation "org.opencontainers.image.source=https://github.com/hibouhq/hibou" \
                --annotation "org.opencontainers.image.version=${app_version}" \
                --annotation "org.opencontainers.image.revision=${GITHUB_SHA}" \
                --annotation "org.opencontainers.image.created=${created}" \
                --annotation "org.opencontainers.image.title=${chart_name}" \
                --annotation "org.opencontainers.image.description=${chart_desc}" \
                "${chart_file}:application/vnd.cncf.helm.chart.content.v1.tar+gzip"
            )"
            echo "${chart_repo}@${chart_digest}" > chart-ref.txt

      - name: Sign Helm chart
        if: github.event_name != 'pull_request' && !github.event.repository.private
        env:
          REPO_OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          ref="$(cat chart-ref.txt)"
          if [[ ! "${ref}" =~ ^ghcr\.io/${REPO_OWNER,,}/charts/hibou@sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::unexpected chart reference '${ref}'"
            exit 1
          fi
          cosign sign --yes "${ref}"

      - name: Verify workflow files are unchanged
        run: diff "${RUNNER_TEMP}/workspace-trust.manifest" <(find .github .devcontainer -printf '%y %m %p %l\n' -type f -exec sha256sum {} + | LC_ALL=C sort) || { echo "::error::.github or .devcontainer changed since checkout"; exit 1; }

      - name: Check Hibou upload config
        id: hibou-ci
        run: |
          # Upload only when the API token secret is set AND the server URL is a
          # real http(s) URL — not empty and not the docs placeholder. This keeps
          # forks and unconfigured repos (or a var left as "your-hibou-domain")
          # from attempting an upload against an unreachable host.
          if [[ -n "$HIBOU_API_TOKEN" && "$HIBOU_SERVER_URL" =~ ^https?://[^[:space:]]+ && "$HIBOU_SERVER_URL" != *your-hibou-domain* ]]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Hibou upload skipped — set repo variable HIBOU_SERVER_URL to a real https:// URL and secret HIBOU_API_TOKEN to enable."
          fi
        env:
          HIBOU_SERVER_URL: ${{ vars.HIBOU_SERVER_URL }}
          HIBOU_API_TOKEN: ${{ secrets.HIBOU_API_TOKEN }}

      # Last, after every signing step: the CLI runs on the host with the
      # job's credentials in reach, so it must not run before anything it could
      # influence. It is the copy of the binary built above from this commit
      # (taken before later container steps); nothing fetched from the Hibou
      # server is ever executed in this job.
      - name: Upload to Hibou
        if: steps.hibou-ci.outputs.enabled == 'true'
        continue-on-error: true
        uses: ./.github/actions/hibou-upload
        with:
          cli-path: ${{ runner.temp }}/dist/hibou-linux-amd64
          # On releases the image SBOM is uploaded afterwards into the same
          # (org, repo, ref, sha) snapshot, so defer completion; otherwise
          # this is the only upload and should finalize the snapshot.
          complete: ${{ github.event_name == 'release' && 'false' || 'true' }}
          server: ${{ vars.HIBOU_SERVER_URL }}
          token: ${{ secrets.HIBOU_API_TOKEN }}
          file: |
            coverage.out
            site/coverage/lcov.info
            junit-go.xml
            site/junit-front.xml
            gosec.sarif
            trivy-fs.sarif
            go-sbom.cdx.json
            frontend-sbom.cdx.json

      - name: Upload image SBOM to Hibou
        if: github.event_name == 'release' && steps.hibou-ci.outputs.enabled == 'true'
        continue-on-error: true
        uses: ./.github/actions/hibou-upload
        with:
          cli-path: ${{ runner.temp }}/dist/hibou-linux-amd64
          # Final upload of the release snapshot; completes it.
          server: ${{ vars.HIBOU_SERVER_URL }}
          token: ${{ secrets.HIBOU_API_TOKEN }}
          file: image-sbom.cdx.json
