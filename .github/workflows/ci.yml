name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: write
  packages: write

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Normalize devcontainer cache refs
        id: cache-vars
        run: |
          ref_name="${{ github.head_ref || github.ref_name }}"
          sanitized_ref_name="$(printf '%s' "$ref_name" | tr -cs 'A-Za-z0-9_.-' '-' | sed -E 's/^[.-]+//; s/-+$//')"
          if [[ -z "$sanitized_ref_name" ]]; then
            sanitized_ref_name="branch"
          elif (( ${#sanitized_ref_name} > 96 )); then
            branch_hash="$(printf '%s' "$ref_name" | sha1sum | cut -c1-12)"
            sanitized_ref_name="${sanitized_ref_name:0:83}-${branch_hash}"
          fi
          echo "branch=${sanitized_ref_name}" >> "$GITHUB_OUTPUT"
          echo "repo=ghcr.io/${{ github.repository }}-devcontainer-cache" >> "$GITHUB_OUTPUT"
          if [[ "${{ github.event_name != 'pull_request' || !github.event.pull_request.head.repo.fork }}" == "true" ]]; then
            {
              echo 'cache_from<<EOF'
              echo "type=registry,ref=ghcr.io/${{ github.repository }}-devcontainer-cache:${sanitized_ref_name}"
              echo 'type=registry,ref=ghcr.io/${{ github.repository }}-devcontainer-cache:main'
              echo 'EOF'
            } >> "$GITHUB_OUTPUT"
          else
            echo "cache_from=" >> "$GITHUB_OUTPUT"
          fi
          if [[ "${{ github.event_name != 'pull_request' || !github.event.pull_request.head.repo.fork }}" == "true" ]]; then
            echo "cache_to=type=registry,ref=ghcr.io/${{ github.repository }}-devcontainer-cache:${sanitized_ref_name},mode=max" >> "$GITHUB_OUTPUT"
          else
            echo "cache_to=" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request' || !github.event.pull_request.head.repo.fork
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and test
        uses: devcontainers/ci@v0.3
        with:
          imageName: ghcr.io/${{ github.repository }}-devcontainer
          cacheFrom: ${{ steps.cache-vars.outputs.cache_from }}
          cacheTo: ${{ steps.cache-vars.outputs.cache_to }}
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && 'always' || 'never' }}
          runCmd: |
            cd site && npm ci && cd ..
            make check-generate
            make build-all
            make lint
            make coverage
            cd site && npm run coverage && cd ..
            make check-reproducible
            # make check-reproducible-image # todo: fix non-determinism in image builds before re-enabling this

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Run gosec
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@latest
          gosec -fmt sarif -out gosec.sarif ./... || true

      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          format: sarif
          output: trivy-fs.sarif

      - name: Generate Go SBOM
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: cyclonedx
          output: go-sbom.cdx.json

      - name: Generate frontend SBOM
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: site/
          format: cyclonedx
          output: frontend-sbom.cdx.json

      - name: Check Hibou upload config
        id: hibou-ci
        run: |
          if [[ -n "$HIBOU_SERVER_URL" && -n "$HIBOU_API_TOKEN" ]]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          HIBOU_SERVER_URL: ${{ secrets.HIBOU_SERVER_URL }}
          HIBOU_API_TOKEN: ${{ secrets.HIBOU_API_TOKEN }}

      - name: Upload to Hibou
        if: steps.hibou-ci.outputs.enabled == 'true'
        continue-on-error: true
        uses: ./.github/actions/hibou-upload
        with:
          expect: 2
          server: ${{ secrets.HIBOU_SERVER_URL }}
          token: ${{ secrets.HIBOU_API_TOKEN }}
          file: |
            coverage.out
            site/coverage/cobertura-coverage.xml
            gosec.sarif
            trivy-fs.sarif
            go-sbom.cdx.json
            frontend-sbom.cdx.json

      - name: Upload security artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-reports
          path: |
            gosec.sarif
            trivy-fs.sarif
            go-sbom.cdx.json
            frontend-sbom.cdx.json
          retention-days: 30

      - name: Upload build artifacts
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: binaries
          path: dist/hibou-*

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download pre-built binaries
        uses: actions/download-artifact@v4
        with:
          name: binaries
          path: dist/

      - name: Upload release artifacts
        uses: softprops/action-gh-release@v2
        with:
          files: dist/hibou-*
          generate_release_notes: true

  docker:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Download pre-built binaries
        uses: actions/download-artifact@v4
        with:
          name: binaries
          path: dist/

      - name: Get commit timestamp
        id: commit
        run: echo "epoch=$(git log -1 --format=%ct)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: Build apko base image
        run: |
          curl -sSL "https://github.com/chainguard-dev/apko/releases/download/v1.2.14/apko_1.2.14_linux_amd64.tar.gz" \
            | tar xz -C /tmp --strip-components=1 && sudo mv /tmp/apko /usr/local/bin/apko
          apko build --lockfile apko.lock.json apko.yaml hibou-base:latest /tmp/hibou-base.tar
          docker load < /tmp/hibou-base.tar

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push multi-arch image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            SOURCE_DATE_EPOCH=${{ steps.commit.outputs.epoch }}

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign image
        run: |
          while IFS= read -r tag; do
            [[ -z "$tag" ]] && continue
            cosign sign --yes "${tag}"
          done <<< "$TAGS"
        env:
          TAGS: ${{ steps.meta.outputs.tags }}

      - name: Generate image SBOM and scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: ${{ fromJSON(steps.meta.outputs.json).tags[0] }}
          format: cyclonedx
          output: image-sbom.cdx.json

      - name: Check Hibou upload config
        id: hibou
        run: |
          if [[ -n "$HIBOU_SERVER_URL" && -n "$HIBOU_API_TOKEN" ]]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          HIBOU_SERVER_URL: ${{ secrets.HIBOU_SERVER_URL }}
          HIBOU_API_TOKEN: ${{ secrets.HIBOU_API_TOKEN }}

      - name: Upload image SBOM to Hibou
        if: steps.hibou.outputs.enabled == 'true'
        continue-on-error: true
        uses: ./.github/actions/hibou-upload
        with:
          expect: 2
          server: ${{ secrets.HIBOU_SERVER_URL }}
          token: ${{ secrets.HIBOU_API_TOKEN }}
          file: image-sbom.cdx.json
