name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  release:
    types: [published]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Log in to GHCR
        if: github.event_name != 'pull_request' || !github.event.pull_request.head.repo.fork
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - parallel:
          - name: Free disk space
            run: .github/scripts/free-disk-space.sh

          - name: Build and push devcontainer
            uses: ./.github/actions/devcontainer-ci
            with:
              registry: ghcr.io
              push-pr-cache: ${{ github.event_name != 'pull_request' || !github.event.pull_request.head.repo.fork }}

      - name: Prepare workspace
        uses: ./.github/actions/devcontainer-ci
        with:
          run-cmd: |
            (cd site && npm ci)
            make check-generate
            # Warm the shared Go build cache once, uncontended. golangci-lint,
            # go test and gosec all load the same package graph; without this
            # each compiles the dependencies from cold while fighting the
            # others for the same two cores.
            go build ./...

      # Two waves of two, not one wave of five.
      #
      # `ubuntu-latest` on a private repo is 2 vCPU / 7 GB. The previous
      # five-way fan-out oversubscribed it ~3x, and the three Go-heavy branches
      # spent most of their time waiting rather than working: lint 11m16s
      # (blew its 10m deadline), Go coverage 9m16s, security suite 9m05s —
      # roughly 10 core-minutes of real work stretched over 11 wall-minutes.
      #
      # Same work, two at a time, so each branch gets a core.
      - parallel:
          - name: Lint
            uses: ./.github/actions/devcontainer-ci
            with:
              run-cmd: make lint

          - name: Build binaries and frontend coverage
            uses: ./.github/actions/devcontainer-ci
            with:
              # GENERATE_DEP= skips the `generate` prerequisite: Prepare
              # already ran check-generate (regenerate + assert clean), and
              # regenerating again HERE races the parallel Lint step —
              # `sqlc diff` reads dbgen/ while this step rewrites it in
              # place, failing Lint with a whole-file phantom diff.
              run-cmd: |
                if [ "${{ github.event_name }}" = "release" ]; then
                  make build-all GENERATE_DEP=
                else
                  make build-image-binaries GENERATE_DEP=
                fi
                (cd site && npm run coverage -- --reporter=default --reporter=junit --outputFile=junit-front.xml)

      - parallel:
          - name: Go coverage
            uses: ./.github/actions/devcontainer-ci
            with:
              # NOTE: no Postgres here by explicit decision (runner resources are
              # tight), so the DB-backed tests skip in CI. They must be run
              # locally before shipping: `docker compose up -d postgres && make test`.
              run-cmd: make coverage

          - name: Security suite
            uses: ./.github/actions/devcontainer-ci
            with:
              run-cmd: |
                gosec -track-suppressions -fmt sarif -out gosec.sarif ./... || true
                trivy fs --format sarif --output trivy-fs.sarif .
                trivy fs --skip-db-update --format cyclonedx --output go-sbom.cdx.json .
                trivy fs --skip-db-update --format cyclonedx --output frontend-sbom.cdx.json site/

      # - name: Check reproducibility
      #   uses: ./.github/actions/devcontainer-ci
      #   with:
      #     run-cmd: |
      #       make check-reproducible

      - name: Get commit info
        if: github.event_name != 'pull_request'
        id: commit
        run: |
          echo "epoch=$(git log -1 --format=%ct)" >> "$GITHUB_OUTPUT"
          echo "short_sha=${GITHUB_SHA:0:7}" >> "$GITHUB_OUTPUT"

      - name: Build and push image
        if: github.event_name != 'pull_request'
        uses: ./.github/actions/devcontainer-ci
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
          REPO: ${{ github.repository }}
          SOURCE_DATE_EPOCH: ${{ steps.commit.outputs.epoch }}
          GITHUB_SHA: ${{ github.sha }}
          GIT_BRANCH: ${{ github.head_ref || github.ref_name }}
          GIT_TARGET_BRANCH: ${{ github.base_ref }}
          GIT_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          IS_RELEASE: ${{ github.event_name == 'release' && 'true' || 'false' }}
          REF_NAME: ${{ github.event.release.tag_name || github.ref_name }}
        with:
          run-cmd: |
            set -euo pipefail
            repo="${REPO,,}"

            # Publish apko base image
            echo "${GITHUB_TOKEN}" | apko login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin
            export BASE_IMAGE="ghcr.io/${repo}-cache:apko-base"
            apko publish --lockfile apko.lock.json apko.yaml "${BASE_IMAGE}"

            # Start Docker daemon
            if ! docker info >/dev/null 2>&1; then
              sudo /usr/local/share/docker-init.sh
              docker info >/dev/null 2>&1 || { echo "ERROR: Docker daemon failed to start"; exit 1; }
            fi

            echo "${GITHUB_TOKEN}" | docker login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin
            # renovate: datasource=github-releases depName=moby/buildkit packageName=moby/buildkit
            BUILDKIT_VERSION='0.30.0'
            docker pull --quiet "moby/buildkit:v${BUILDKIT_VERSION}"
            docker buildx create --use --name multiarch --driver docker-container \
              --driver-opt="image=moby/buildkit:v${BUILDKIT_VERSION}"

            sanitize() { echo "$1" | sed 's/[^a-zA-Z0-9._-]/-/g'; }
            export SHA_TAG="sha-${GITHUB_SHA:0:7}"
            export REPO="ghcr.io/${repo}"
            export CACHE_REPO="ghcr.io/${repo}-cache"
            export GIT_BRANCH="$(sanitize "${GIT_BRANCH}")"
            export GIT_TARGET_BRANCH="$(sanitize "${GIT_TARGET_BRANCH}")"
            export GIT_DEFAULT_BRANCH="$(sanitize "${GIT_DEFAULT_BRANCH}")"
            if [ "${IS_RELEASE}" = "true" ]; then
              export INCLUDE_EXTRA_CLI_BINARIES=true
            else
              export INCLUDE_EXTRA_CLI_BINARIES=false
            fi
            export PUSH=true
            export CACHE_PUSH=true

            # On release, add semver tags
            if [ "${IS_RELEASE}" = "true" ]; then
              export RELEASE_VERSION="${REF_NAME#v}"
              if [[ "${RELEASE_VERSION}" != *-* ]]; then
                export STABLE_RELEASE=true
                highest=$(git tag -l 'v*' --sort=-v:refname | grep -Ev -- '-' | head -1)
                [ "${REF_NAME}" = "${highest}" ] && export LATEST=true
              fi
            fi

            docker buildx bake -f docker-bake.hcl

      # - name: SonarCloud scan
      #   uses: SonarSource/sonarcloud-github-action@v3
      #   continue-on-error: true
      #   env:
      #     GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      #     SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: Check Hibou upload config
        id: hibou-ci
        run: |
          # Upload only when the API token secret is set AND the server URL is a
          # real http(s) URL — not empty and not the docs placeholder. This keeps
          # forks and unconfigured repos (or a var left as "your-hibou-domain")
          # from attempting an upload against an unreachable host.
          if [[ -n "$HIBOU_API_TOKEN" && "$HIBOU_SERVER_URL" =~ ^https?://[^[:space:]]+ && "$HIBOU_SERVER_URL" != *your-hibou-domain* ]]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Hibou upload skipped — set repo variable HIBOU_SERVER_URL to a real https:// URL and secret HIBOU_API_TOKEN to enable."
          fi
        env:
          HIBOU_SERVER_URL: ${{ vars.HIBOU_SERVER_URL }}
          HIBOU_API_TOKEN: ${{ secrets.HIBOU_API_TOKEN }}

      - name: Upload to Hibou
        if: steps.hibou-ci.outputs.enabled == 'true'
        continue-on-error: true
        uses: ./.github/actions/hibou-upload
        with:
          # On releases the image SBOM is uploaded afterwards into the same
          # (org, repo, ref, sha) snapshot, so defer completion; otherwise
          # this is the only upload and should finalize the snapshot.
          complete: ${{ github.event_name == 'release' && 'false' || 'true' }}
          server: ${{ vars.HIBOU_SERVER_URL }}
          token: ${{ secrets.HIBOU_API_TOKEN }}
          file: |
            coverage.out
            site/coverage/lcov.info
            junit-go.xml
            site/junit-front.xml
            gosec.sarif
            trivy-fs.sarif
            go-sbom.cdx.json
            frontend-sbom.cdx.json

      - name: Upload security artifacts
        if: always() && vars.UPLOAD_GITHUB_SECURITY_ARTIFACTS == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: security-reports
          path: |
            gosec.sarif
            trivy-fs.sarif
            go-sbom.cdx.json
            frontend-sbom.cdx.json
          retention-days: 30

      # --- Release-only steps (tag pushes) ---

      - name: Compute release version
        if: github.event_name == 'release'
        id: release
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Upload release binaries
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          REF_NAME: ${{ github.event.release.tag_name }}
        run: |
          gh release upload "${REF_NAME}" \
            dist/hibou-darwin-arm64 \
            dist/hibou-linux-amd64 \
            dist/hibou-linux-arm64 \
            dist/hibou-windows-amd64.exe \
            dist/hibou-windows-arm64.exe \
            --clobber

      - name: Install cosign
        if: github.event_name == 'release'
        uses: sigstore/cosign-installer@v3

      - name: Sign image
        if: github.event_name == 'release'
        env:
          REPO: ${{ github.repository }}
          REF_NAME: ${{ github.event.release.tag_name }}
        run: |
          version="${REF_NAME#v}"
          image="ghcr.io/${REPO,,}"
          digest=$(docker buildx imagetools inspect "${image}:${version}" --format '{{.Manifest.Digest}}')
          cosign sign --yes "${image}@${digest}"

      - name: Generate image SBOM
        if: github.event_name == 'release'
        uses: ./.github/actions/devcontainer-ci
        with:
          run-cmd: |
            trivy image --format cyclonedx --output image-sbom.cdx.json ghcr.io/${{ github.repository }}:${{ steps.release.outputs.version }}

      - name: Upload image SBOM to Hibou
        if: github.event_name == 'release' && steps.hibou-ci.outputs.enabled == 'true'
        continue-on-error: true
        uses: ./.github/actions/hibou-upload
        with:
          # Final upload of the release snapshot; completes it.
          server: ${{ vars.HIBOU_SERVER_URL }}
          token: ${{ secrets.HIBOU_API_TOKEN }}
          file: image-sbom.cdx.json

      - name: Publish Helm chart
        if: github.event_name != 'pull_request'
        uses: ./.github/actions/devcontainer-ci
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
          REPO_OWNER: ${{ github.repository_owner }}
          REF_NAME: ${{ github.event.release.tag_name || github.ref_name }}
          GITHUB_SHA: ${{ github.sha }}
          SOURCE_DATE_EPOCH: ${{ steps.commit.outputs.epoch }}
        with:
          registry: ghcr.io
          run-cmd: |
            set -euo pipefail

            echo "${GITHUB_TOKEN}" | helm registry login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin
            echo "${GITHUB_TOKEN}" | oras login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin

            # Compute tags and versions
            sha_tag="sha-${GITHUB_SHA:0:7}"
            if [[ "${REF_NAME}" == v* ]]; then
              chart_version="${REF_NAME#v}"
              app_version="${REF_NAME#v}"
              tags="${chart_version}"
            else
              chart_version="0.0.0-${sha_tag}"
              app_version="${sha_tag}"
              tags="${chart_version}"
            fi
            created="$(date -u -d "@${SOURCE_DATE_EPOCH}" +%Y-%m-%dT%H:%M:%SZ)"

            # Build chart dependencies and package
            helm repo add cloudnative-pg https://cloudnative-pg.github.io/charts --force-update
            helm repo update
            helm dependency build chart/hibou
            chart_tmpdir="$(mktemp -d)"
            helm package chart/hibou --version "${chart_version}" --app-version "${app_version}" --destination "${chart_tmpdir}"
            chart_tgz="${chart_tmpdir}/hibou-${chart_version}.tgz"
            repo_owner="${REPO_OWNER,,}"
            chart_file="$(basename "${chart_tgz}")"

            # Build OCI config from packaged chart
            chart_show="$(helm show chart "${chart_tgz}")"
            chart_name="$(echo "${chart_show}" | grep '^name:' | awk '{print $2}')"
            chart_desc="$(echo "${chart_show}" | grep '^description:' | sed 's/^description: //')"
            chart_api="$(echo "${chart_show}" | grep '^apiVersion:' | awk '{print $2}')"
            config_file="helm-config.json"
            printf '{"name":"%s","version":"%s","description":"%s","apiVersion":"%s","appVersion":"%s"}' \
              "${chart_name}" "${chart_version}" "${chart_desc}" "${chart_api}" "${app_version}" \
              > "${chart_tmpdir}/${config_file}"

            # Push with oras: multiple tags + OCI annotations
            (
              cd "${chart_tmpdir}"
              oras push "ghcr.io/${repo_owner}/charts/${chart_name}:${tags}" \
                --config "${config_file}:application/vnd.cncf.helm.config.v1+json" \
                --annotation "org.opencontainers.image.source=https://github.com/hibouhq/hibou" \
                --annotation "org.opencontainers.image.version=${app_version}" \
                --annotation "org.opencontainers.image.revision=${GITHUB_SHA}" \
                --annotation "org.opencontainers.image.created=${created}" \
                --annotation "org.opencontainers.image.title=${chart_name}" \
                --annotation "org.opencontainers.image.description=${chart_desc}" \
                "${chart_file}:application/vnd.cncf.helm.chart.content.v1.tar+gzip"
            )
