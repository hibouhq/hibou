name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: write
  packages: write

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Log in to GHCR
        if: github.event_name != 'pull_request' || !github.event.pull_request.head.repo.fork
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and test
        uses: devcontainers/ci@v0.3
        with:
          imageName: ghcr.io/${{ github.repository }}-devcontainer
          cacheFrom: ghcr.io/${{ github.repository }}-devcontainer
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && 'always' || 'never' }}
          runCmd: |
            cd site && npm ci && cd ..
            make build-all
            make lint
            make test
            make check-reproducible
            make check-reproducible-image

      - name: Upload build artifacts
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: binaries
          path: dist/hibou-*

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download pre-built binaries
        uses: actions/download-artifact@v4
        with:
          name: binaries
          path: dist/

      - name: Upload release artifacts
        uses: softprops/action-gh-release@v2
        with:
          files: dist/hibou-*
          generate_release_notes: true

  docker:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Download pre-built binaries
        uses: actions/download-artifact@v4
        with:
          name: binaries
          path: dist/

      - name: Get commit timestamp
        id: commit
        run: echo "epoch=$(git log -1 --format=%ct)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: Build apko base image
        run: |
          curl -sSL "https://github.com/chainguard-dev/apko/releases/download/v1.2.14/apko_1.2.14_linux_amd64.tar.gz" \
            | tar xz -C /tmp --strip-components=1 && sudo mv /tmp/apko /usr/local/bin/apko
          apko build --lockfile apko.lock.json apko.yaml hibou-base:latest /tmp/hibou-base.tar
          docker load < /tmp/hibou-base.tar

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push multi-arch image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            SOURCE_DATE_EPOCH=${{ steps.commit.outputs.epoch }}

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign image
        run: |
          while IFS= read -r tag; do
            [[ -z "$tag" ]] && continue
            cosign sign --yes "${tag}"
          done <<< "$TAGS"
        env:
          TAGS: ${{ steps.meta.outputs.tags }}

      - name: Generate image SBOM
        uses: anchore/sbom-action@v0
        with:
          image: ${{ fromJSON(steps.meta.outputs.json).tags[0] }}
          format: cyclonedx-json
          output-file: image-sbom.cdx.json

      - name: Attach SBOM to image
        run: |
          while IFS= read -r tag; do
            [[ -z "$tag" ]] && continue
            cosign attach sbom --sbom image-sbom.cdx.json "${tag}"
          done <<< "$TAGS"
        env:
          TAGS: ${{ steps.meta.outputs.tags }}

      - name: Check Hibou upload config
        id: hibou
        run: |
          if [[ -n "$HIBOU_SERVER_URL" && -n "$HIBOU_API_TOKEN" ]]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          HIBOU_SERVER_URL: ${{ secrets.HIBOU_SERVER_URL }}
          HIBOU_API_TOKEN: ${{ secrets.HIBOU_API_TOKEN }}

      - name: Upload image SBOM to Hibou
        if: steps.hibou.outputs.enabled == 'true'
        uses: ./.github/actions/hibou-upload
        with:
          server: ${{ secrets.HIBOU_SERVER_URL }}
          token: ${{ secrets.HIBOU_API_TOKEN }}
          file: image-sbom.cdx.json
