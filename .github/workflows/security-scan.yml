name: Security Scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Run gosec
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@latest
          gosec -fmt sarif -out gosec.sarif ./... || true

      - name: Run Trivy (filesystem)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          format: sarif
          output: trivy-fs.sarif

      - name: Generate Go SBOM
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: cyclonedx-json
          output-file: go-sbom.cdx.json
          artifact-name: go-sbom

      - name: Install frontend dependencies
        run: cd site && npm ci

      - name: Generate frontend SBOM
        uses: anchore/sbom-action@v0
        with:
          path: site/
          format: cyclonedx-json
          output-file: frontend-sbom.cdx.json
          artifact-name: frontend-sbom

      - name: Check Hibou upload config
        id: hibou
        run: |
          if [[ -n "$HIBOU_SERVER_URL" && -n "$HIBOU_API_TOKEN" ]]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          HIBOU_SERVER_URL: ${{ secrets.HIBOU_SERVER_URL }}
          HIBOU_API_TOKEN: ${{ secrets.HIBOU_API_TOKEN }}

      - name: Upload to Hibou
        if: steps.hibou.outputs.enabled == 'true'
        uses: ./.github/actions/hibou-upload
        with:
          server: ${{ secrets.HIBOU_SERVER_URL }}
          token: ${{ secrets.HIBOU_API_TOKEN }}
          file: |
            gosec.sarif
            trivy-fs.sarif
            go-sbom.cdx.json
            frontend-sbom.cdx.json

      - name: Upload SARIF artifacts (fallback)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-reports
          path: |
            gosec.sarif
            trivy-fs.sarif
            go-sbom.cdx.json
            frontend-sbom.cdx.json
          retention-days: 30
