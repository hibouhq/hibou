name: Devcontainer CI
description: |
  Build a devcontainer with registry caching, then run commands inside it.
  Handles QEMU, Buildx, image refs, caching, push strategy, and multi-arch builds.

inputs:
  registry:
    description: 'Container registry base URL for devcontainer cache images'
    required: true
  run-cmd:
    description: 'Command(s) to run inside the devcontainer after build'
    default: 'echo "Devcontainer ready"'
  push-branches:
    description: 'Additional branches eligible for push (pipe-separated globs), matched against the exact, unmodified ref name of a `push` event. The repo default branch is always eligible. Pull requests never push.'
    default: 'main|master|release*'
  push-image:
    description: 'Push the prebuild image when the event is eligible (push event to the default branch or a push-branches match)'
    default: 'true'
  push-cache:
    description: 'Push BuildKit cache layers when the event is eligible'
    default: 'true'
  push-pr-cache:
    description: 'Deprecated and ignored: pull requests never push images or caches (a same-repo PR branch could otherwise poison them).'
    default: 'false'
  no-cache:
    description: 'Force fresh build with no cache'
    default: 'false'
  platform:
    description: 'Target platform(s) for prebuild images pushed to registry (e.g. linux/amd64,linux/arm64)'
    default: 'linux/amd64'
  config-file:
    description: 'Path to devcontainer.json'
    default: '.devcontainer/devcontainer.json'
  inherit-env:
    description: 'Inherit all environment variables from the runner'
    default: 'true'

outputs:
  image-name:
    description: 'Full image name (without tag)'
    value: ${{ steps.refs.outputs.image_name }}
  image-tag:
    description: 'Tag(s) applied to the image'
    value: ${{ steps.refs.outputs.image_tag }}
  should-push:
    description: 'Whether the image was pushed to registry'
    value: ${{ steps.refs.outputs.should_push }}

runs:
  using: composite
  steps:
    - name: Check if devcontainer is running
      id: check
      shell: bash
      run: |
        if devcontainer exec --workspace-folder . true 2>/dev/null; then
          echo "running=true" >> "${GITHUB_OUTPUT}"
        else
          echo "running=false" >> "${GITHUB_OUTPUT}"
        fi

    - name: Set up QEMU
      if: ${{ steps.check.outputs.running == 'false' }}
      uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      with:
        cache-image: false

    - name: Set up Docker Buildx
      if: ${{ steps.check.outputs.running == 'false' }}
      uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

    - name: Compute devcontainer image refs
      if: ${{ steps.check.outputs.running == 'false' }}
      id: refs
      shell: bash
      env:
        INPUT_REGISTRY: ${{ inputs.registry }}
        INPUT_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        INPUT_PUSH_BRANCHES: ${{ inputs.push-branches }}
        INPUT_PUSH_IMAGE: ${{ inputs.push-image }}
        INPUT_PUSH_CACHE: ${{ inputs.push-cache }}
      run: |
        set -euo pipefail

        sanitize_tag(){
          printf '%s' "$1" \
            | tr '[:upper:]' '[:lower:]' \
            | sed -E 's#[^a-z0-9._-]+#-#g; s#(^[-.]+|[-.]+$)##g'
        }

        repo="$(printf '%s' "${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')"
        branch="${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}"
        default_branch="${INPUT_DEFAULT_BRANCH}"

        branch_tag="$(sanitize_tag "${branch}")"
        default_branch_tag="$(sanitize_tag "${default_branch}")"
        image_name="${INPUT_REGISTRY}/${repo}-devcontainer"

        branch_cache="type=registry,ref=${image_name}:buildcache-${branch_tag}"
        target_tag="$(sanitize_tag "${GITHUB_BASE_REF:-${branch}}")"
        target_cache="type=registry,ref=${image_name}:buildcache-${target_tag}"
        default_branch_cache="type=registry,ref=${image_name}:buildcache-${default_branch_tag}"

        # Push strategy
        should_push='false'
        cache_to=''
        image_tag="${branch_tag}"

        _matches_pattern(){
          local value="$1" patterns="$2"
          [ -z "${patterns}" ] && return 1
          local IFS='|'
          for pat in ${patterns}; do
            # shellcheck disable=SC2254
            case "${value}" in ${pat}) return 0 ;; esac
          done
          return 1
        }

        # Push eligibility is decided on the exact, unsanitized ref of a push
        # event. Sanitized tags are only used to name images and caches, never
        # to decide trust: a PR branch named "Main" sanitizes to "main".
        is_push_event='false'
        [ "${GITHUB_EVENT_NAME}" = 'push' ] && is_push_event='true'

        origin_cache=''
        if [ "${GITHUB_REF_TYPE}" = 'tag' ]; then
          # Tags: no push, no cache-to; use default branch image + originating branch cache
          image_tag="${default_branch_tag}"
          # Find the branch this tag was created from
          origin_branch=$(git branch -r --contains HEAD --format='%(refname:short)' 2>/dev/null \
            | sed 's|^origin/||' | grep -v '^HEAD$' \
            | grep -xF "${default_branch}" || true)
          if [ -z "${origin_branch}" ]; then
            origin_branch=$(git branch -r --contains HEAD --format='%(refname:short)' 2>/dev/null \
              | sed 's|^origin/||' | grep -v '^HEAD$' | head -1 || true)
          fi
          if [ -n "${origin_branch}" ] && [ "${origin_branch}" != "${default_branch}" ]; then
            origin_tag="$(sanitize_tag "${origin_branch}")"
            origin_cache="type=registry,ref=${image_name}:buildcache-${origin_tag}"
          fi
        elif [ "${is_push_event}" = 'true' ] && [ -n "${default_branch}" ] && [ "${GITHUB_REF}" = "refs/heads/${default_branch}" ]; then
          image_tag="${default_branch_tag},latest"
          if [ "${INPUT_PUSH_IMAGE}" != 'false' ]; then
            should_push='true'
          fi
          if [ "${INPUT_PUSH_CACHE}" != 'false' ]; then
            cache_to="${default_branch_cache},mode=max"
          fi
        elif [ "${is_push_event}" = 'true' ] && [ "${GITHUB_REF}" = "refs/heads/${GITHUB_REF_NAME}" ] \
          && [ "${branch_tag}" != "${default_branch_tag}" ] \
          && _matches_pattern "${GITHUB_REF_NAME}" "${INPUT_PUSH_BRANCHES}"; then
          # A non-default branch never writes the default branch's tags
          # (checked on the sanitized name too, since that is what is written).
          if [ "${INPUT_PUSH_IMAGE}" != 'false' ]; then
            should_push='true'
          fi
          if [ "${INPUT_PUSH_CACHE}" != 'false' ]; then
            cache_to="${branch_cache},mode=max"
          fi
        fi

        {
          echo "image_name=${image_name}"
          echo "image_tag=${image_tag}"
          echo "default_branch_tag=${default_branch_tag}"
          if [ -n "${GITHUB_BASE_REF}" ]; then
            echo "target_tag=${target_tag}"
          else
            echo "target_tag="
          fi
          echo "should_push=${should_push}"
          echo "cache_to=${cache_to}"
          echo "cache_from<<CACHEEOF"
          printf '%s\n' "${branch_cache}" "${target_cache}" "${default_branch_cache}" ${origin_cache:+"${origin_cache}"} | sort -u
          echo "CACHEEOF"
        } >> "${GITHUB_OUTPUT}"

        echo ""
        echo "┌─────────────────────────────────────────────────────────"
        echo "│ Devcontainer image refs"
        echo "├─────────────────────────────────────────────────────────"
        echo "│ Branch:          ${branch}"
        echo "│ Image:           ${image_name}:${image_tag}"
        echo "│ Push image:      ${should_push}"
        echo "│ Cache to:        ${cache_to:-none}"
        echo "│ Cache from:"
        echo "│   branch:        ${branch_cache}"
        echo "│   target:        ${target_cache}"
        echo "│   default:       ${default_branch_cache}"
        echo "│   origin:        ${origin_cache:-none}"
        echo "└─────────────────────────────────────────────────────────"

        {
          echo "### 🐳 Devcontainer"
          echo ""
          echo "| | |"
          echo "|---|---|"
          echo "| **Branch** | \`${branch}\` |"
          echo "| **Prebuild image** | \`${image_name}:${image_tag}\` |"
          if [ "${should_push}" = 'true' ]; then
            echo "| **Push image** | ✅ Yes |"
          else
            echo "| **Push image** | ⛔ No |"
          fi
          if [ -n "${cache_to}" ]; then
            echo "| **Cache push** | \`${cache_to}\` |"
          else
            echo "| **Cache push** | ⛔ Disabled |"
          fi
          echo ""
          echo "<details><summary>Cache sources</summary>"
          echo ""
          echo "| Source | Ref |"
          echo "|--------|-----|"
          echo "| Branch | \`${branch_cache}\` |"
          echo "| Target | \`${target_cache}\` |"
          echo "| Default | \`${default_branch_cache}\` |"
          echo ""
          echo "</details>"
        } >> "${GITHUB_STEP_SUMMARY}"

    - name: Compute filtered env for container
      if: ${{ inputs.inherit-env == 'true' }}
      id: filtered-env
      shell: bash
      run: |
        SKIP_VARS="$(grep -vE '^#|^$' "${GITHUB_ACTION_PATH}/../ci-skip-env" | tr '\n' '|' | sed 's/|$//')"
        {
          echo "env<<CIENVEOF"
          while IFS= read -r -d '' entry; do
            key="${entry%%=*}"
            value="${entry#*=}"
            [[ "${key}" =~ ^[A-Za-z_][A-Za-z0-9_]*$ ]] || continue
            [[ "${key}" =~ ^(${SKIP_VARS})$ ]] && continue
            [[ "${value}" == *$'\n'* ]] && continue
            printf '%s=%s\n' "${key}" "${value}"
          done < <(env -0)
          echo "CIENVEOF"
        } >> "${GITHUB_OUTPUT}"

    # renovate: datasource=npm depName=@devcontainers/cli
    - name: Install devcontainer CLI
      if: ${{ steps.check.outputs.running == 'false' }}
      shell: bash
      env:
        DEVCONTAINER_CLI_VERSION: '0.87.0'
      run: |
        if ! command -v devcontainer &>/dev/null; then
          npm install -g --ignore-scripts "@devcontainers/cli@${DEVCONTAINER_CLI_VERSION}"
        fi

    - name: Build and push devcontainer
      if: ${{ steps.check.outputs.running == 'false' && steps.refs.outputs.should_push == 'true' }}
      shell: bash
      env:
        CONFIG_FILE: ${{ inputs.config-file }}
        IMAGE_NAME: ${{ steps.refs.outputs.image_name }}
        IMAGE_TAG: ${{ steps.refs.outputs.image_tag }}
        PLATFORM: ${{ inputs.platform }}
        NO_CACHE: ${{ inputs.no-cache }}
        CACHE_FROM: ${{ steps.refs.outputs.cache_from }}
        CACHE_TO: ${{ steps.refs.outputs.cache_to }}
      run: |
        set -euo pipefail

        args=(--workspace-folder . --config "${CONFIG_FILE}")

        IFS=',' read -ra tags <<< "${IMAGE_TAG}"
        for tag in "${tags[@]}"; do
          args+=(--image-name "${IMAGE_NAME}:${tag}")
        done

        if [[ "${NO_CACHE}" == 'true' ]]; then
          args+=(--no-cache)
        else
          while IFS= read -r cf; do
            [[ -n "${cf}" ]] && args+=(--cache-from "${cf}")
          done <<< "${CACHE_FROM}"
        fi
        [[ -n "${CACHE_TO}" ]] && args+=(--cache-to "${CACHE_TO}")

        [[ -n "${PLATFORM}" ]] && args+=(--platform "${PLATFORM}")
        args+=(--push)

        devcontainer build "${args[@]}"

    - name: Start devcontainer
      if: ${{ steps.check.outputs.running == 'false' }}
      shell: bash
      env:
        CONFIG_FILE: ${{ inputs.config-file }}
        IMAGE_NAME: ${{ steps.refs.outputs.image_name }}
        IMAGE_TAG: ${{ steps.refs.outputs.image_tag }}
        DEFAULT_BRANCH_TAG: ${{ steps.refs.outputs.default_branch_tag }}
        TARGET_TAG: ${{ steps.refs.outputs.target_tag }}
        SHOULD_PUSH: ${{ steps.refs.outputs.should_push }}
        REF_TYPE: ${{ github.ref_type }}
        FILTERED_ENV: ${{ steps.filtered-env.outputs.env }}
      run: |
        set -euo pipefail

        # Use default docker driver to avoid OCI tar export from docker-container driver
        docker buildx use default

        # Pull cache images in priority order: default branch → target branch → current branch
        # Deduplicates automatically; tag builds skip current branch (never pushed)
        cache_tags=("${DEFAULT_BRANCH_TAG}")
        if [[ -n "${TARGET_TAG}" && "${TARGET_TAG}" != "${DEFAULT_BRANCH_TAG}" ]]; then
          cache_tags+=("${TARGET_TAG}")
        fi
        if [[ "${REF_TYPE}" != 'tag' ]]; then
          first_tag="${IMAGE_TAG%%,*}"
          if [[ "${first_tag}" != "${DEFAULT_BRANCH_TAG}" && "${first_tag}" != "${TARGET_TAG}" ]]; then
            cache_tags+=("${first_tag}")
          fi
        fi

        cache_images=()
        for tag in "${cache_tags[@]}"; do
          img="${IMAGE_NAME}:${tag}"
          echo "Pulling ${img} for local cache..."
          docker pull "${img}" || true
          cache_images+=("${img}")
        done

        args=(--workspace-folder . --config "${CONFIG_FILE}" --skip-post-create)
        for img in "${cache_images[@]}"; do
          args+=(--cache-from "${img}")
        done

        if [[ -n "${FILTERED_ENV}" ]]; then
          while IFS= read -r line; do
            [[ -n "${line}" ]] && args+=(--remote-env "${line}")
          done <<< "${FILTERED_ENV}"
        fi

        devcontainer up "${args[@]}"

    - name: Run command in devcontainer
      if: ${{ inputs.run-cmd != 'echo "Devcontainer ready"' }}
      shell: bash
      env:
        RUN_CMD: ${{ inputs.run-cmd }}
        INHERIT_ENV: ${{ inputs.inherit-env }}
      run: |
        SKIP_VARS="$(grep -vE '^#|^$' "${GITHUB_ACTION_PATH}/../ci-skip-env" | tr '\n' '|' | sed 's/|$//')"

        args=()
        if [[ "${INHERIT_ENV}" == "true" ]]; then
          while IFS= read -r -d '' entry; do
            key="${entry%%=*}"
            value="${entry#*=}"
            [[ "${key}" =~ ^[A-Za-z_][A-Za-z0-9_]*$ ]] || continue
            [[ "${key}" =~ ^(${SKIP_VARS}|INHERIT_ENV|RUN_CMD)$ ]] && continue
            [[ "${value}" == *$'\n'* ]] && continue
            args+=("--remote-env" "${key}=${value}")
          done < <(env -0)
        fi
        printf '%s\n' "${RUN_CMD}" | devcontainer exec "${args[@]}" --default-user-env-probe loginShell --workspace-folder . -- \
          bash -c 'set -e; _script=$(cat); exec </dev/null; eval "${_script}"'
