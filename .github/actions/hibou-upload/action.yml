name: hibou-upload
description: "Upload SBOM, SARIF, coverage, or JUnit test-result artifacts to Hibou. Works with GitHub Actions and Forgejo Actions."

inputs:
  server:
    description: "Hibou server URL."
    required: true
  token:
    description: "Hibou API token."
    required: true
  org:
    description: "Organization slug in provider/slug form (e.g. github/my-org). Auto-detected from CI environment when omitted."
    required: false
  repo:
    description: "Repository slug. Auto-detected from CI environment when omitted."
    required: false
  file:
    description: "Path(s) to artifact files. Supports glob patterns and newline-separated paths."
    required: true
  ref:
    description: "Git ref. Defaults to GITHUB_REF / GITEA_REF."
    required: false
  sha:
    description: "Commit SHA. Defaults to GITHUB_SHA / GITEA_SHA."
    required: false
  complete:
    description: "Complete the snapshot after uploading. Set to 'false' for intermediate uploads in multi-job pipelines."
    required: false
    default: "true"
  expect:
    description: "Expected number of distinct upload API calls for the snapshot. Server auto-completes when this many are received. Use for parallel pipelines where no single job knows it is last."
    required: false
    default: "0"
  reachability:
    description: "Run CI-side reachability analysis after upload. Comma-separated languages: 'java', 'rust', 'java,rust'. Go reachability runs server-side automatically when enabled. Set to 'false' to skip (default)."
    required: false
    default: "false"
  cli-path:
    description: "Absolute path to a hibou CLI binary you built or verified yourself (recommended). When set, nothing is downloaded."
    required: false
    default: ""
  cli-sha256:
    description: "Expected SHA-256 of the CLI binary for this runner's OS/arch. Required to download the CLI from the Hibou server; the download is refused unless it matches. Ignored when cli-path is set."
    required: false
    default: ""
  bytecode-path:
    description: "Java bytecode path override for non-standard build layouts (e.g. Ant with custom output dirs). Auto-discovery handles Maven and Gradle projects of any size without configuration."
    required: false
    default: ""

runs:
  using: composite
  steps:
    # The CLI runs with the API token, so it must never be whatever the server
    # hands out. Order: an explicit cli-path; else a server download pinned to
    # cli-sha256; else a hibou already on PATH (installed by the workflow).
    # The binary is referenced by absolute path via HIBOU_BIN; nothing is
    # added to GITHUB_PATH, so later steps' tools cannot be shadowed.
    - name: Install hibou CLI
      shell: bash
      env:
        HIBOU_SERVER: ${{ inputs.server }}
        INPUT_CLI_PATH: ${{ inputs.cli-path }}
        INPUT_CLI_SHA256: ${{ inputs.cli-sha256 }}
      run: |
        set -euo pipefail

        if [[ -n "$INPUT_CLI_PATH" ]]; then
          if [[ "$INPUT_CLI_PATH" != /* && ! "$INPUT_CLI_PATH" =~ ^[A-Za-z]:[\\/] ]]; then
            echo "cli-path must be an absolute path: $INPUT_CLI_PATH" >&2
            exit 1
          fi
          if [[ ! -f "$INPUT_CLI_PATH" ]]; then
            echo "cli-path does not exist: $INPUT_CLI_PATH" >&2
            exit 1
          fi
          [[ -x "$INPUT_CLI_PATH" ]] || chmod +x "$INPUT_CLI_PATH"
          printf 'HIBOU_BIN=%s\n' "$INPUT_CLI_PATH" >> "$GITHUB_ENV"
          exit 0
        fi

        if [[ -z "$INPUT_CLI_SHA256" ]]; then
          if existing="$(command -v hibou 2>/dev/null)"; then
            echo "Using hibou from PATH: $existing"
            printf 'HIBOU_BIN=%s\n' "$existing" >> "$GITHUB_ENV"
            exit 0
          fi
          echo "No CLI available: set cli-path to a binary you built, or cli-sha256 to download a pinned CLI from the server." >&2
          exit 1
        fi

        expected="$(printf '%s' "$INPUT_CLI_SHA256" | tr '[:upper:]' '[:lower:]')"
        if [[ ! "$expected" =~ ^[0-9a-f]{64}$ ]]; then
          echo "cli-sha256 must be a 64-character hex SHA-256" >&2
          exit 1
        fi

        runner_os="$(uname -s | tr '[:upper:]' '[:lower:]')"
        runner_arch="$(uname -m)"

        case "$runner_os" in
          linux*)
            runner_os="linux"
            ;;
          darwin*)
            runner_os="darwin"
            ;;
          mingw*|msys*|cygwin*)
            runner_os="windows"
            ;;
          *)
            echo "unsupported runner OS: $runner_os" >&2
            exit 1
            ;;
        esac

        case "$runner_arch" in
          x86_64|amd64)
            runner_arch="amd64"
            ;;
          aarch64|arm64)
            runner_arch="arm64"
            ;;
          *)
            echo "unsupported runner architecture: $runner_arch" >&2
            exit 1
            ;;
        esac

        ext=""
        if [[ "$runner_os" == "windows" ]]; then
          ext=".exe"
        fi

        dest_dir="$(mktemp -d "${RUNNER_TEMP:-/tmp}/hibou-cli.XXXXXX")"
        dest="${dest_dir}/hibou${ext}"
        echo "Downloading hibou for ${runner_os}/${runner_arch} from server..."
        curl -fsSL --proto '=https,http' "${HIBOU_SERVER}/api/v1/bin/${runner_os}/${runner_arch}" -o "$dest"

        if command -v sha256sum >/dev/null 2>&1; then
          actual="$(sha256sum "$dest" | cut -d' ' -f1)"
        else
          actual="$(shasum -a 256 "$dest" | cut -d' ' -f1)"
        fi
        if [[ "$actual" != "$expected" ]]; then
          rm -rf "$dest_dir"
          echo "hibou CLI checksum mismatch: expected ${expected}, got ${actual}" >&2
          exit 1
        fi

        chmod +x "$dest"
        printf 'HIBOU_BIN=%s\n' "$dest" >> "$GITHUB_ENV"

    - name: Upload artifact
      shell: bash
      env:
        INPUT_ORG: ${{ inputs.org }}
        INPUT_REPO: ${{ inputs.repo }}
        INPUT_FILE: ${{ inputs.file }}
        INPUT_REF: ${{ inputs.ref }}
        INPUT_SHA: ${{ inputs.sha }}
        INPUT_COMPLETE: ${{ inputs.complete }}
        INPUT_EXPECT: ${{ inputs.expect }}
        INPUT_REACHABILITY: ${{ inputs.reachability }}
        INPUT_BYTECODE_PATH: ${{ inputs.bytecode-path }}
        HIBOU_SERVER: ${{ inputs.server }}
        HIBOU_TOKEN: ${{ inputs.token }}
      run: |
        set -euo pipefail

        # org / repo / ref / sha are auto-detected by the hibou CLI from the CI
        # environment (GITHUB_*, GITEA_*, GitLab CI_*), so this wrapper only
        # forwards explicit overrides. The CLI owns all CI-context detection --
        # the bash side does not duplicate or pre-empt it.
        ctx_flags=()
        [[ -n "$INPUT_ORG"  ]] && ctx_flags+=(--org  "$INPUT_ORG")
        [[ -n "$INPUT_REPO" ]] && ctx_flags+=(--repo "$INPUT_REPO")
        [[ -n "$INPUT_REF"  ]] && ctx_flags+=(--ref  "$INPUT_REF")
        [[ -n "$INPUT_SHA"  ]] && ctx_flags+=(--sha  "$INPUT_SHA")

        # Expand globs and newline-separated paths into file list
        files=()
        while IFS= read -r pattern; do
          pattern="$(echo "$pattern" | xargs)"
          [[ -n "$pattern" ]] || continue
          for f in $pattern; do
            [[ -f "$f" ]] && files+=("$f")
          done
        done <<< "$INPUT_FILE"

        [[ ${#files[@]} -gt 0 ]] || { echo 'no files found matching the provided pattern(s)' >&2; exit 1; }

        upload_flags=("${ctx_flags[@]}")
        if [[ "$INPUT_COMPLETE" == "false" ]]; then
          upload_flags+=(--complete=false)
        fi
        if [[ "$INPUT_EXPECT" != "0" && -n "$INPUT_EXPECT" ]]; then
          upload_flags+=(--expect="$INPUT_EXPECT")
        fi

        "$HIBOU_BIN" upload "${files[@]}" "${upload_flags[@]}"

        # Run CI-side reachability analysis if requested
        if [[ "$INPUT_REACHABILITY" != "false" && -n "$INPUT_REACHABILITY" ]]; then
          reachability_args=("${ctx_flags[@]}")

          # Parse comma-separated languages
          IFS=',' read -ra langs <<< "$INPUT_REACHABILITY"
          for lang in "${langs[@]}"; do
            lang="$(echo "$lang" | xargs)"
            reachability_args+=(--lang "$lang")
          done

          # Add bytecode path override if provided (Java)
          if [[ -n "$INPUT_BYTECODE_PATH" ]]; then
            reachability_args+=(--bytecode "$INPUT_BYTECODE_PATH")
          fi

          "$HIBOU_BIN" analyze reachability "${reachability_args[@]}"
        fi
