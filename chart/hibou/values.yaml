hibou:
  image:
    repository: ghcr.io/hibouhq/hibou
    # -- Image tag. Empty uses the chart's appVersion, so a chart release always runs the server it was tested with.
    tag: ""
    pullPolicy: IfNotPresent
  replicas: 1
  # -- Delayed background loops for the primary deployment. Leave enabled for
  # combined mode, or disable them here when running dedicated worker pods.
  background:
    artifactProcessing: true
    retention: true
    staleScan: true
    stalePending: true
    # -- Secret scanning loop on the request-serving pod. Off by default: it clones repositories, which competes with request handling. Prefer worker.enabled with worker.background.secretScan. Enabling it here also means raising scratch.sizeLimit, since repository clones are far larger than the default allows.
    secretScan: false
  # -- Writable scratch volume for the request-serving pod. Always mounted: the root filesystem is read-only, and the CVE feed sweep keeps a blobless clone of the CVE list (~10 MB, no file contents) that cannot be made optional without the feed silently watching nothing. TMPDIR points here, so anything else that needs temporary space lands here too and stays bounded by sizeLimit — the omission that caused the Trivy-DB DiskPressure eviction storm.
  scratch:
    mountPath: /var/tmp/hibou
    # -- Sized for the one-off CVE corpus seed (~300 MB, removed afterwards) plus the ~10 MB sweep clone. Raise to 10Gi or more before enabling background.secretScan on this pod, which clones whole repositories.
    sizeLimit: 1Gi
  # -- CVE Program feed (ADR-028). Always on; there is nothing to enable and no corpus to import by hand — the first sweep seeds itself and takes about fifteen minutes.
  cveFeed:
    # -- The repository to sweep and to seed from. Empty uses the public cvelistV5 list. For an instance with no outbound internet, mirror that list onto an internal git server and point this at it: everything follows this one setting.
    remote: ""
    # -- Sweep interval. Upstream commits roughly 2.8 times an hour, so polling faster only costs requests.
    interval: 15m
  # -- Secret scanning feature config (shared by API and worker pods via the configmap). enabled gates enqueue + the feature as a whole; the loop that clones is gated separately by background.secretScan (API pod) / worker.background.secretScan (worker pod).
  secretScan:
    enabled: false
    onPush: true
    # -- Detection engines, executed in order; duplicate findings dedup by fingerprint. betterleaks adds live credential verification and can also prove a credential dead (invalid/revoked), which demotes its severity. NOTE: "trufflehog" is accepted but currently ignored by the server — it needs a shell in the runtime image, which we deliberately do not ship.
    providers:
      - gitleaks
      - betterleaks
    # -- Skip and warn above this repository size. Empty uses the app default (2048).
    maxRepoMB: ""
    # -- Per-job scan timeout. Empty uses the app default (5m).
    timeout: ""
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
      # -- The scratch emptyDir draws on the node's ephemeral storage. Without an
      # explicit request the kubelet picks this pod first when it evicts under
      # disk pressure. Keep at or above scratch.sizeLimit, and raise both together
      # before enabling background.secretScan here.
      ephemeral-storage: 1Gi
    limits:
      cpu: 500m
      memory: 512Mi
      ephemeral-storage: 2Gi
  logging:
    level: info
    format: json
  # -- Prometheus /metrics endpoint (ADR-039).
  metrics:
    # -- Serve /metrics at all. false removes it from every port.
    enabled: true
    # -- Dedicated port, never forwarded by the ingress, so /metrics stays cluster-internal. Exposed as the `metrics` port of the Service and of every hibou pod (workers included).
    port: 9090
    # -- Optional bearer token scrapers must send, on top of the dedicated port.
    auth:
      # -- Existing Secret holding the token. Empty disables token auth.
      existingSecret: ""
      existingSecretKey: token
    # -- Prometheus Operator PodMonitor (also converted by the VictoriaMetrics operator). A PodMonitor rather than a ServiceMonitor because worker pods have no Service but export their own job counters. Requires the monitoring.coreos.com CRDs.
    podMonitor:
      enabled: false
      interval: 60s
      scrapeTimeout: 10s
      # -- Extra labels, e.g. the release label your Prometheus selects on.
      labels: {}
    # -- NetworkPolicy for hibou pods: the application port stays open to all, the metrics port only to `from`. Needs a CNI that enforces NetworkPolicy.
    networkPolicy:
      enabled: false
      # -- Peers allowed to scrape, as NetworkPolicy `from` entries. Required when enabled.
      from: []
      #  - namespaceSelector:
      #      matchLabels:
      #        kubernetes.io/metadata.name: monitoring
  # -- Storage usage sampler (ADR-039): Postgres and artifact-ledger stats every interval, exported on /metrics.
  storageUsage:
    enabled: true
    interval: 15m
    # -- Lists the artifact backend to measure what it actually holds (orphan detection). Off by default: on S3 each 1,000 keys is a billed LIST request.
    inventory:
      enabled: false
      interval: 24h
      maxObjects: 1000000
  database:
    url: ""
  trivy:
    url: ""
  advisory:
    cache:
      ttl: "6h"
    osv:
      url: "https://api.osv.dev"
  # -- Override the base URL. Auto-derived from ingress.hostname when ingress is enabled. Required: the server refuses to start without one (it signs Secure, __Host- cookies and checks request origins against it).
  baseURL: ""
  # -- Extra origins (scheme://host[:port]) the CSRF check accepts besides baseURL, e.g. a second hostname for the same instance.
  allowedOrigins: []
  # -- Client IP behind a CDN in front of the ingress. When the peer the ingress saw is in cidrs, the IP in header is used for rate limits, audit logs and webhook IP allowlists. Leave header empty unless every listed range belongs to the CDN.
  trustedProxy:
    # -- e.g. CF-Connecting-IP
    header: ""
    # -- The CDN's egress ranges (e.g. https://www.cloudflare.com/ips/). Required with header.
    cidrs: []
  # -- Serve Swagger UI at /api/v1/docs (inline script, relaxed CSP). Off by default outside development.
  apiDocs:
    enabled: false
  # -- Maximum upload size in bytes (default 100 MiB).
  maxUploadSize: "104857600"
  # -- Mount the Kubernetes service account token into hibou pods. Hibou never calls the Kubernetes API, so the token would only help an attacker who reached code execution in the pod.
  automountServiceAccountToken: false
  # -- Set GOMEMLIMIT to this percentage of the container memory limit, so the Go GC works harder before the kernel OOM-kills the pod. 0 disables. Needs a memory limit in resources.limits.memory (Ki/Mi/Gi/Ti or K/M/G/T suffix).
  goMemLimitPercent: 80
  # -- MCP listener (plain HTTP on mcp.port, all interfaces). Disable unless an MCP client inside the cluster needs it.
  mcp:
    enabled: false
    # -- MCP listener port (HIBOU_MCP_PORT). Must differ from 8080 and metrics.port.
    port: 8081
  # -- Retention overrides passed to the server. Empty keeps the server default.
  retention:
    # -- "true" lets the retention worker delete expired data instead of only reporting it.
    autoPurge: ""
  # -- Default-deny NetworkPolicy for hibou pods (server and workers). Off by default because it locks down hibou's own ingress and egress, which must match your ingress controller and external dependencies; turn it on wherever the CNI enforces NetworkPolicy. When on, only the listed traffic is allowed, and the metrics policy's open application-port rule is dropped. The ingress-only policies on the bundled SeaweedFS, PostgreSQL and Trivy are separate and on by default (seaweedfs/postgresql/trivy.networkPolicy).
  networkPolicy:
    enabled: false
    # -- Peers allowed to reach the application port (8080), as NetworkPolicy `from` entries. The default matches k3s, whose Traefik runs in kube-system. Other controllers live elsewhere: ingress-nginx in `ingress-nginx`, a Traefik Helm install in `traefik`, the AWS/GCE load balancers send traffic from node or VPC addresses (use an ipBlock with the node/VPC CIDR). Check with `kubectl get pods -A -l app.kubernetes.io/name=<controller>` and set the matching namespace, or the ingress returns 502/504 once the policy is on.
    ingressFrom:
      - namespaceSelector:
          matchLabels:
            kubernetes.io/metadata.name: kube-system
    # -- Peers allowed to reach the MCP port when hibou.mcp.enabled, as NetworkPolicy `from` entries. Empty admits pods in the release namespace only.
    mcpFrom: []
    # -- In-namespace ports hibou pods may reach: bundled Postgres, SeaweedFS S3 and Trivy.
    inNamespacePorts: [5432, 8333, 4954]
    # -- External TCP ports hibou may reach outside private ranges: forge APIs, OSV, the CVE feed, webhook notifications. Add 465/587 for email integrations.
    externalPorts: [443]
    # -- Extra egress rules appended as-is (external database, S3, SMTP relay...).
    extraEgress: []
  # -- Pod anti-affinity for stateless Hibou and worker replicas. Use soft by default so single-node clusters still schedule.
  podAntiAffinity:
    enabled: true
    type: soft
    topologyKey: kubernetes.io/hostname
    weight: 100
  # -- Rolling update settings for disposable stateless replicas.
  rollingUpdate:
    maxSurge: 1
    maxUnavailable: 0
  # -- Health probe settings. Liveness stays process-local; readiness checks database connectivity.
  probes:
    liveness:
      path: /api/v1/health
      initialDelaySeconds: 10
      periodSeconds: 10
      # -- Tolerate a briefly busy process (GC, a large upload) before restarting it: 6 x 10s with a 3s timeout.
      timeoutSeconds: 3
      failureThreshold: 6
    readiness:
      path: /api/v1/ready
      initialDelaySeconds: 5
      periodSeconds: 10
  # -- Ordered graceful shutdown settings. terminationGracePeriodSeconds must exceed timeoutSeconds + preStopSleepSeconds.
  shutdown:
    timeoutSeconds: 20
    preStopSleepSeconds: 5
    terminationGracePeriodSeconds: 30
  # -- PodDisruptionBudget for Hibou and worker deployments. Renders only when the matching replica count is greater than 1.
  pdb:
    enabled: true
    minAvailable: 1
    maxUnavailable: ""
  # -- Auto-provision an organization when a forge app installation webhook is received.
  # When true, installing the GitHub/GitLab/Forgejo app on an account creates the matching
  # Hibou org and grants the installer admin. Off by default: on a public App anyone could
  # create a tenant. Enable it together with auth.allowedOrgs/allowedUsers.
  autoProvisionOrgs: false
  # -- Restrict who may sign in. Empty lists keep sign-in open to every forge
  # account. A user is admitted when their login is in allowedUsers or they
  # are a member of one of allowedOrgs (GitHub only; checked with the App's
  # installation token, so the App needs Members: read).
  auth:
    allowedOrgs: []
    allowedUsers: []
  # -- Existing Secret whose `emails` key holds the instance-admin list
  # (comma- or newline-separated). Mounted as a volume and re-read by the
  # server on every check, so editing the Secret takes effect within the
  # kubelet sync period (~1 min) with no restart.
  # Create/update with:
  #   kubectl create secret generic hibou-instance-admins \
  #     --from-literal=emails="a@example.com,b@example.com" \
  #     --dry-run=client -o yaml | kubectl apply -f -
  instanceAdminsExistingSecret: ""
  # -- Session secret for cookie signing. Leave empty to generate and retain a stable chart-managed secret.
  # Prefer sessionSecretExistingSecret in production to avoid storing the value in Helm release metadata.
  # Multi-replica deployments require one stable secret shared by every replica; rotating it invalidates existing hibou_session and hibou_oauth_state cookies.
  sessionSecret: ""
  # -- Existing Secret containing HIBOU_SESSION_SECRET key. Takes precedence over sessionSecret.
  sessionSecretExistingSecret: ""
  # -- Forge providers. Each entry maps to HIBOU_FORGE_<index>_* env vars.
  # Secrets (clientId, clientSecret, webhookSecret) can be provided inline
  # or via an existing Kubernetes Secret referenced by existingSecret.
  forges: []
  # - type: github        # available types: github, gitlab, forgejo
  #   id: github          # optional, defaults to type
  #   url: ""             # optional, defaults to provider's public URL
  #   clientId: ""        # OAuth2 client ID (for user login)
  #   clientSecret: ""    # OAuth2 client secret (for user login)
  #   webhookSecret: ""
  #   appId: ""           # GitHub App ID (enables org-wide mode)
  #   privateKey: ""      # PEM private key (multiline, use existingSecret)
  #   existingSecret: ""  # if set, Secret must expose HIBOU_FORGE_<index>_* env-style keys
  #   ipAllowlist: false  # enable source IP allowlisting (GitHub: auto /meta, GitLab SaaS: built-in defaults)
  #   rateLimitRPS: 0     # per-IP rate limit (req/s) on webhooks. 0 = disabled
  #   allowedCIDRs: ""    # override default CIDRs (e.g., for self-hosted forges)
  #   tier: report        # read | report | propose: the most the forge's tokens may do (ADR-052)
  # -- Optional dedicated worker deployment. Same binary, separate replica set.
  # Enable this and disable hibou.background.* on the primary deployment for an
  # API-only plus worker-only split.
  worker:
    enabled: false
    replicas: 1
    background:
      artifactProcessing: true
      retention: true
      staleScan: true
      stalePending: true
      # -- Secret scanning worker loop. Off by default even on workers: it clones repositories, so enable it deliberately alongside worker.scratch and an ephemeral-storage limit.
      secretScan: false
    # -- Writable scratch volume. The root filesystem is read-only, so any work that clones or unpacks to disk needs this. sizeLimit is what stops a runaway clone from filling the node — the omission that caused the Trivy-DB DiskPressure eviction storm.
    scratch:
      enabled: true
      mountPath: /var/tmp/hibou
      sizeLimit: 10Gi
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
        # -- Scheduler needs this to place the pod on a node with room for clones. Keep at or above scratch.sizeLimit.
        ephemeral-storage: 2Gi
      limits:
        cpu: 500m
        memory: 512Mi
        # -- Hard cap: the kubelet evicts this pod rather than the whole node when a clone runs away.
        ephemeral-storage: 12Gi

artifact:
  # -- Artifact storage backend. Leave empty to default to bundled SeaweedFS when enabled, otherwise filesystem.
  # Operators have three artifact-store paths: bundled SeaweedFS by default, external S3-compatible storage via artifact.s3.*, or this filesystem backend with the optional RWX PVC below.
  backend: ""
  # -- Filesystem artifact path. Defaults to /data/artifacts when unset.
  path: ""
  filesystem:
    persistence:
      # -- Optional shared PVC for the filesystem backend. Keep disabled by default; enable only when backend=filesystem and your cluster provides RWX storage.
      enabled: false
      # -- Access mode for the filesystem PVC. Multi-replica filesystem is allowed only when this is ReadWriteMany.
      accessMode: ReadWriteMany
      # -- Persistent volume size for the filesystem artifact PVC.
      size: 10Gi
      # -- StorageClass name for the filesystem artifact PVC. Leave empty for the cluster default.
      storageClass: ""
  s3:
    # -- External S3-compatible endpoint. Leave empty to use the bundled SeaweedFS service when enabled.
    endpoint: ""
    # -- S3 region. SeaweedFS defaults to us-east-1 for AWS SDK compatibility.
    region: us-east-1
    # -- External S3 bucket name. Leave empty to use seaweedfs.bucket when bundled SeaweedFS is active.
    bucket: ""
    # -- Existing Secret containing keys accessKeyID and secretAccessKey for external S3 credentials.
    existingSecret: ""
    # -- Access key ID for the managed external S3 Secret when existingSecret is not set.
    accessKeyID: ""
    # -- Secret access key for the managed external S3 Secret when existingSecret is not set.
    secretAccessKey: ""
    # -- Force path-style S3 addressing. Required for SeaweedFS and common for self-hosted S3 endpoints.
    usePathStyle: true
    # -- Use TLS for external S3 traffic.
    useSSL: true

seaweedfs:
  # -- Deploy bundled SeaweedFS as the default shared artifact store.
  # Use this bundled RWO-backed store by default, disable it and set artifact.s3.* for an external S3-compatible endpoint, or keep backend=filesystem with artifact.filesystem.persistence enabled for an operator-managed RWX filesystem.
  enabled: true
  image:
    # NOTE: the runnable SeaweedFS image is published on Docker Hub as
    # chrislusf/seaweedfs. The ghcr.io/seaweedfs/seaweedfs path only hosts the Helm chart.
    repository: chrislusf/seaweedfs
    # -- Tag pinned to the multi-arch index digest; Renovate (helm-values) keeps both current.
    tag: "4.34@sha256:6620371e8af8282056685c652d4637265698c9e2c2d59f9594e6ac333ad6c634"
    pullPolicy: IfNotPresent
  # -- Ingress NetworkPolicy, always rendered with the bundled SeaweedFS: only hibou pods and the bucket job reach the S3 port. It is also what keeps the S3 gateway's gRPC port (8333+10000), which accepts unauthenticated IAM updates, unreachable, so run a CNI that enforces NetworkPolicy.
  networkPolicy:
    # -- Extra `from` peers for the S3 port (e.g. a backup job).
    extraFrom: []
  # -- Existing Secret containing keys accessKeyID, secretAccessKey, and s3-config.json.
  # When empty, the chart generates and retains credentials for the bundled store.
  accessKeyExistingSecret: ""
  # -- Default bucket name for Hibou artifacts in the bundled SeaweedFS S3 API.
  bucket: hibou-artifacts
  # -- Maximum number of volumes the bundled volume server may host (weed -volume.max).
  # Must exceed the number of collections in use (default + artifacts). Do not leave
  # this to SeaweedFS auto-detection, which derives the cap from free disk and can
  # collapse to 1 on a near-full data dir, starving the artifacts collection.
  maxVolumes: 10
  storage:
    # -- Persistent volume size for bundled SeaweedFS data.
    size: 10Gi
    # -- StorageClass name for bundled SeaweedFS. Leave empty for the cluster default.
    storageClass: ""
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  bootstrap:
    image:
      repository: public.ecr.aws/aws-cli/aws-cli
      tag: "2.28.5@sha256:e8f0e645303194054200380689603c0957c6e36de516e97f9d43bb2f98634e25"
      pullPolicy: IfNotPresent

postgresql:
  enabled: true
  image:
    repository: postgres
    # -- Tag pinned to the multi-arch index digest; Renovate (helm-values) keeps both current.
    tag: "18@sha256:74935e72241653ca55e0414067e6d8763aceb8a810eb51b452253ec3dcfc4336"
    pullPolicy: IfNotPresent
  # -- Ingress NetworkPolicy on the bundled PostgreSQL: only hibou server and worker pods reach 5432. Restricts traffic within the release only, so on by default.
  networkPolicy:
    enabled: true
    # -- Extra `from` peers (e.g. a backup or admin tool).
    extraFrom: []
  auth:
    # Provide an existing Secret containing key: url (full postgres:// connection string).
    # When postgresql.enabled=true, the same Secret must also contain key: password
    # for the bundled PostgreSQL container. auth.username and auth.database still
    # come from values and must match the bundled PostgreSQL settings.
    # Create it with:
    #   kubectl create secret generic hibou-db-url -n hibou \
    #     --from-literal=url="postgres://user:pass@host:5432/db?sslmode=require" \
    #     --from-literal=password="pass"
    # existingSecret only replaces the password source for bundled PostgreSQL.
    existingSecret: ""
    username: hibou
    # Set via --set in dev. In production, use existingSecret instead.
    password: ""
    database: hibou
  persistence:
    enabled: true
    size: 10Gi
    # -- StorageClass name for bundled PostgreSQL. Leave empty for the cluster default.
    storageClass: ""
  resources:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 1Gi

# -- CloudNativePG operator and managed PostgreSQL cluster.
# Mutually exclusive with postgresql.enabled.
cnpg:
  # -- Deploy the CNPG operator via subchart.
  operator:
    enabled: false
  # -- Deploy a CNPG PostgreSQL Cluster.
  cluster:
    enabled: false
    # -- Number of PostgreSQL instances (1 = single, 2+ = HA with streaming replication).
    instances: 1
    image:
      repository: ghcr.io/cloudnative-pg/postgresql
      tag: "18.0@sha256:f06cae6ae14e2f101392130dce800b504bf9c5110b5db5fc0266782464882dbb"
    # -- Ingress NetworkPolicy on the CNPG instances: 5432 from hibou pods and the cluster's own pods, 8000 (instance manager) from the operator. Opt-in: the operator must be reachable or it loses track of the cluster.
    networkPolicy:
      enabled: false
      # -- `from` peers for the operator. Empty uses this release's CNPG subchart pods (cnpg.operator.enabled); required otherwise, e.g. a namespaceSelector for cnpg-system.
      operatorFrom: []
      # -- Extra `from` peers for 5432.
      extraFrom: []
    storage:
      size: 10Gi
      # -- StorageClass name. Leave empty for default.
      storageClass: ""
    resources:
      requests:
        cpu: 250m
        memory: 256Mi
      limits:
        cpu: "1"
        memory: 1Gi
    # -- Database name.
    database: hibou
    # -- Database owner.
    owner: hibou
    # -- Enable TLS for PostgreSQL connections.
    tls: true
    # -- Pod anti-affinity preset: "soft" or "hard". Use "hard" for multi-node HA.
    antiAffinity: "soft"
    # -- Backup configuration for continuous WAL archiving.
    backup:
      enabled: false
      # -- S3-compatible destination (e.g., s3://bucket/path/).
      destinationPath: ""
      # -- Existing Secret with S3 credentials (keys: ACCESS_KEY_ID, ACCESS_SECRET_KEY).
      s3CredentialsSecret: ""
      # -- S3 endpoint URL (e.g., https://fsn1.your-objectstorage.com).
      endpointURL: ""
      # -- Scheduled backup cron expression (default: daily at 02:00 UTC).
      schedule: "0 0 2 * * *"
      # -- Retention policy for scheduled backups.
      retentionPolicy: "30d"

trivy:
  enabled: true
  image:
    repository: aquasec/trivy
    # -- Pinned: trivy server and the CLI clients must stay protocol-compatible, and latest is not reproducible.
    tag: "0.72.0@sha256:cffe3f5161a47a6823fbd23d985795b3ed72a4c806da4c4df16266c02accdd6f"
    pullPolicy: IfNotPresent
  # -- Ingress NetworkPolicy on the bundled Trivy server: only hibou server and worker pods reach 4954. Restricts traffic within the release only, so on by default.
  networkPolicy:
    enabled: true
    # -- Extra `from` peers.
    extraFrom: []
  cache:
    # -- Cap on the vulnerability DB cache. Trivy re-downloads a ~1 GB DB on a
    # schedule; without a bound it grows into the node's ephemeral storage and
    # takes every other pod on the node down with it via DiskPressure.
    sizeLimit: 3Gi
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
      # An explicit ephemeral-storage request is what keeps the kubelet from
      # picking this pod first when it starts evicting under disk pressure.
      ephemeral-storage: 3Gi
    limits:
      cpu: 500m
      memory: 512Mi
      ephemeral-storage: 4Gi

ingress:
  enabled: false
  # -- The hostname for the Hibou ingress. Also sets HIBOU_BASE_URL.
  hostname: ""
  # -- Ingress class name (e.g., "nginx", "traefik").
  className: ""
  # -- Additional annotations (e.g., cert-manager.io/cluster-issuer).
  annotations: {}
  # -- Path configuration.
  path: /
  pathType: Prefix
  tls:
    # -- Enable TLS. When true and no existingSecret is set,
    # relies on annotations (e.g., cert-manager) to provision the certificate.
    enabled: false
    # -- Name of an existing TLS Secret. If empty and tls.enabled=true,
    # a secret name is auto-generated as "<fullname>-tls".
    existingSecret: ""

# -- Grafana dashboards deployed as GrafanaDashboard CRDs (requires Grafana Operator).
grafanaDashboards:
  enabled: false
  # -- Labels to select the target Grafana instance.
  instanceSelector:
    matchLabels:
      dashboards: "grafana"
  # -- Allow importing dashboards across namespaces.
  allowCrossNamespaceImport: false
  # -- Grafana folder to organize dashboards in.
  folder: "Hibou"
  # -- Built-in CNPG dashboard from the official cloudnative-pg project.
  cnpg:
    enabled: true
    # -- URL to the CNPG dashboard JSON. Override to pin a specific version.
    url: "https://raw.githubusercontent.com/cloudnative-pg/grafana-dashboards/main/charts/cluster/grafana-dashboard.json"
