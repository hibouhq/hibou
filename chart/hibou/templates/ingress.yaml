{{- if .Values.ingress.enabled }}
{{- $fullName := include "hibou.fullname" . -}}
{{- $hostname := required "ingress.hostname is required when ingress.enabled=true" .Values.ingress.hostname -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $fullName }}
  labels:
    {{- include "hibou.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- if .Values.ingress.className }}
  ingressClassName: {{ .Values.ingress.className | quote }}
  {{- end }}
  rules:
    - host: {{ $hostname | quote }}
      http:
        paths:
          - path: {{ .Values.ingress.path | default "/" }}
            pathType: {{ .Values.ingress.pathType | default "Prefix" }}
            backend:
              service:
                name: {{ $fullName }}
                port:
                  number: 8080
  {{- if .Values.ingress.tls.enabled }}
  tls:
    - hosts:
        - {{ $hostname | quote }}
      secretName: {{ .Values.ingress.tls.existingSecret | default (printf "%s-tls" $fullName) }}
  {{- end }}
{{- end }}