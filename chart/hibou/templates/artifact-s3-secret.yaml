{{- if and (eq (include "hibou.artifactBackend" .) "s3") (ne (include "hibou.artifactUsesBundledSeaweedFS" .) "true") (not .Values.artifact.s3.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "hibou.artifactS3CredentialsSecretName" . }}
  labels:
    {{- include "hibou.labels" . | nindent 4 }}
type: Opaque
stringData:
  accessKeyID: {{ .Values.artifact.s3.accessKeyID | default "" | quote }}
  secretAccessKey: {{ .Values.artifact.s3.secretAccessKey | default "" | quote }}
{{- end }}
