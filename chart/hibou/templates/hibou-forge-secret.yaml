{{- range $i, $forge := .Values.hibou.forges }}
{{- if not $forge.existingSecret }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "hibou.fullname" $ }}-forge-{{ $i }}
  labels:
    {{- include "hibou.labels" $ | nindent 4 }}
type: Opaque
stringData:
  {{ printf "HIBOU_FORGE_%d_CLIENT_ID" $i }}: {{ $forge.clientId | default "" | quote }}
  {{ printf "HIBOU_FORGE_%d_CLIENT_SECRET" $i }}: {{ $forge.clientSecret | default "" | quote }}
  {{ printf "HIBOU_FORGE_%d_WEBHOOK_SECRET" $i }}: {{ $forge.webhookSecret | default "" | quote }}
  {{- if $forge.appId }}
  {{ printf "HIBOU_FORGE_%d_APP_ID" $i }}: {{ $forge.appId | quote }}
  {{- end }}
  {{- if $forge.privateKey }}
  {{ printf "HIBOU_FORGE_%d_PRIVATE_KEY" $i }}: {{ $forge.privateKey | quote }}
  {{- end }}
{{- end }}
{{- end }}
