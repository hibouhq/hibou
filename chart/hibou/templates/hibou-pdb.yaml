{{- include "hibou.validateStatelessness" . }}
{{- if and .Values.hibou.pdb.enabled (gt (int .Values.hibou.replicas) 1) }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "hibou.fullname" . }}
  labels:
    {{- include "hibou.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      {{- include "hibou.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: server
  {{- if .Values.hibou.pdb.maxUnavailable }}
  maxUnavailable: {{ .Values.hibou.pdb.maxUnavailable }}
  {{- else }}
  minAvailable: {{ .Values.hibou.pdb.minAvailable }}
  {{- end }}
{{- end }}
{{- if and .Values.hibou.worker.enabled .Values.hibou.pdb.enabled (gt (int .Values.hibou.worker.replicas) 1) }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "hibou.fullname" . }}-worker
  labels:
    {{- include "hibou.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      {{- include "hibou.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: worker
  {{- if .Values.hibou.pdb.maxUnavailable }}
  maxUnavailable: {{ .Values.hibou.pdb.maxUnavailable }}
  {{- else }}
  minAvailable: {{ .Values.hibou.pdb.minAvailable }}
  {{- end }}
{{- end }}
