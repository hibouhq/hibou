{{- if not .Values.hibou.sessionSecretExistingSecret }}
{{- $secretName := include "hibou.sessionSecretName" . }}
{{- $existing := (lookup "v1" "Secret" .Release.Namespace $secretName) | default dict }}
{{- $data := get $existing "data" | default dict }}
{{- $generatedSecret := default (randAlphaNum 64) ((get $data "HIBOU_SESSION_SECRET") | b64dec) }}
{{- $sessionSecret := default $generatedSecret .Values.hibou.sessionSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  labels:
    {{- include "hibou.labels" . | nindent 4 }}
type: Opaque
stringData:
  HIBOU_SESSION_SECRET: {{ $sessionSecret | quote }}
{{- end }}
