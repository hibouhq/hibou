{{- if and .Values.hibou.sessionSecret (not .Values.hibou.sessionSecretExistingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "hibou.fullname" . }}-session
  labels:
    {{- include "hibou.labels" . | nindent 4 }}
type: Opaque
stringData:
  HIBOU_SESSION_SECRET: {{ .Values.hibou.sessionSecret | quote }}
{{- end }}
