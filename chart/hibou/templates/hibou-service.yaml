apiVersion: v1
kind: Service
metadata:
  name: {{ include "hibou.fullname" . }}
  labels:
    {{- include "hibou.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "hibou.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: server
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
    {{- if ne (include "hibou.metricsPort" .) "0" }}
    # Cluster-internal scrape target; the ingress only forwards port 8080.
    - name: metrics
      port: {{ include "hibou.metricsPort" . }}
      targetPort: metrics
      protocol: TCP
    {{- end }}
