{{- if and .Values.postgresql.enabled .Values.postgresql.networkPolicy.enabled }}
# The bundled PostgreSQL admits only hibou server and worker pods (plus
# postgresql.networkPolicy.extraFrom). Rendered independently of
# hibou.networkPolicy.enabled: it restricts ingress within the release only.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "hibou.fullname" . }}-postgresql
  labels:
    {{- include "hibou.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "hibou.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: postgresql
  policyTypes: [Ingress]
  ingress:
    - ports:
        - port: 5432
          protocol: TCP
      from:
        {{- include "hibou.componentPeer" (dict "root" . "components" (list "server" "worker")) | nindent 8 }}
        {{- with .Values.postgresql.networkPolicy.extraFrom }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
{{- end }}
{{- if and .Values.cnpg.cluster.enabled .Values.cnpg.cluster.networkPolicy.enabled }}
---
# CloudNativePG instances: PostgreSQL from hibou pods and from the cluster's
# own pods (replication, join jobs); the instance manager's status port from
# the operator. Opt-in: an operator outside this release must be described in
# cnpg.cluster.networkPolicy.operatorFrom, or the operator loses its view of
# the cluster.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "hibou.fullname" . }}-pg
  labels:
    {{- include "hibou.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      cnpg.io/cluster: {{ include "hibou.fullname" . }}-pg
  policyTypes: [Ingress]
  ingress:
    - ports:
        - port: 5432
          protocol: TCP
      from:
        {{- include "hibou.componentPeer" (dict "root" . "components" (list "server" "worker")) | nindent 8 }}
        - podSelector:
            matchLabels:
              cnpg.io/cluster: {{ include "hibou.fullname" . }}-pg
        {{- with .Values.cnpg.cluster.networkPolicy.extraFrom }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    - ports:
        - port: 8000
          protocol: TCP
      from:
        {{- with .Values.cnpg.cluster.networkPolicy.operatorFrom }}
        {{- toYaml . | nindent 8 }}
        {{- else }}
        {{- if not .Values.cnpg.operator.enabled }}
        {{- fail "cnpg.cluster.networkPolicy.operatorFrom is required when the CNPG operator is not deployed by this chart (cnpg.operator.enabled=false)" }}
        {{- end }}
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: cloudnative-pg
              app.kubernetes.io/instance: {{ .Release.Name }}
        {{- end }}
{{- end }}
