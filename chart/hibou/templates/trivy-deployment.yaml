{{- if .Values.trivy.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "hibou.trivyServiceName" . }}
  labels:
    {{- include "hibou.labels" . | nindent 4 }}
    app.kubernetes.io/component: trivy
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: trivy
      {{- include "hibou.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        app.kubernetes.io/component: trivy
        {{- include "hibou.selectorLabels" . | nindent 8 }}
    spec:
      containers:
        - name: trivy
          image: {{ printf "%s:%s" .Values.trivy.image.repository .Values.trivy.image.tag | quote }}
          imagePullPolicy: {{ .Values.trivy.image.pullPolicy }}
          args:
            - server
            - --listen
            - 0.0.0.0:4954
          env:
            # Pin the cache location so the vulnerability DB lands on the mounted
            # volume below rather than the container's writable layer, which is
            # node ephemeral storage and is not bounded by anything.
            - name: TRIVY_CACHE_DIR
              value: /var/cache/trivy
          ports:
            - name: http
              containerPort: 4954
              protocol: TCP
          resources:
            {{- toYaml .Values.trivy.resources | nindent 12 }}
          volumeMounts:
            - name: cache
              mountPath: /var/cache/trivy
      volumes:
        # The Trivy DB is ~1 GB and is refreshed periodically. Unbounded, it
        # fills the node disk, trips DiskPressure and gets the whole namespace
        # evicted. sizeLimit caps it so only this pod is ever at risk.
        - name: cache
          emptyDir:
            sizeLimit: {{ .Values.trivy.cache.sizeLimit }}
{{- end }}