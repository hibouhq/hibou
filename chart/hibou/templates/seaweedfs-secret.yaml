{{- if and .Values.seaweedfs.enabled (not .Values.seaweedfs.accessKeyExistingSecret) }}
{{- $secretName := include "hibou.seaweedfsSecretName" . }}
{{- $existing := (lookup "v1" "Secret" .Release.Namespace $secretName) | default dict }}
{{- $data := get $existing "data" | default dict }}
{{- $accessKey := default (randAlphaNum 20) ((get $data "accessKeyID") | b64dec) }}
{{- $secretKey := default (randAlphaNum 40) ((get $data "secretAccessKey") | b64dec) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  labels:
    {{- include "hibou.labels" . | nindent 4 }}
type: Opaque
stringData:
  accessKeyID: {{ $accessKey | quote }}
  secretAccessKey: {{ $secretKey | quote }}
  s3-config.json: |
    {
      "identities": [
        {
          "name": "hibou",
          "credentials": [
            {
              "accessKey": {{ $accessKey | quote }},
              "secretKey": {{ $secretKey | quote }}
            }
          ],
          "actions": [
            "Admin",
            "Read",
            "Write",
            "List",
            "Tagging"
          ]
        }
      ]
    }
{{- end }}
