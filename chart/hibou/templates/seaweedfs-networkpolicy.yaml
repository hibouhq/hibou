{{- if .Values.seaweedfs.enabled }}
# Always rendered with the bundled SeaweedFS, independent of
# hibou.networkPolicy.enabled. Only the S3 port is admitted, and only from
# hibou pods and the bucket bootstrap job. Master, volume and filer bind
# loopback (statefulset args), but the S3 gateway's gRPC port (s3.port+10000)
# shares the S3 bind address and cannot be moved to loopback on its own: it
# serves an unauthenticated IAM-cache API (PutIdentity) that would hand any
# caller full S3 access. This policy is what closes it, so it needs a CNI that
# enforces NetworkPolicy.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "hibou.fullname" . }}-seaweedfs
  labels:
    {{- include "hibou.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "hibou.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: seaweedfs
  policyTypes: [Ingress]
  ingress:
    - ports:
        - port: s3
          protocol: TCP
      from:
        {{- include "hibou.componentPeer" (dict "root" . "components" (list "server" "worker" "seaweedfs-bootstrap")) | nindent 8 }}
        {{- with .Values.seaweedfs.networkPolicy.extraFrom }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
{{- end }}
