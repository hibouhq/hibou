apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "hibou.fullname" . }}
  labels:
    {{- include "hibou.labels" . | nindent 4 }}
data:
  HIBOU_HOST: "0.0.0.0"
  HIBOU_PORT: "8080"
  HIBOU_LOG_LEVEL: {{ .Values.hibou.logging.level | quote }}
  HIBOU_LOG_FORMAT: {{ .Values.hibou.logging.format | quote }}
  HIBOU_ARTIFACT_BACKEND: {{ include "hibou.artifactBackend" . | quote }}
  {{- if eq (include "hibou.artifactBackend" .) "filesystem" }}
  HIBOU_ARTIFACT_PATH: {{ include "hibou.artifactFilesystemPath" . | quote }}
  {{- end }}
  {{- if eq (include "hibou.artifactBackend" .) "s3" }}
  HIBOU_ARTIFACT_S3_ENDPOINT: {{ include "hibou.artifactS3Endpoint" . | quote }}
  HIBOU_ARTIFACT_S3_REGION: {{ .Values.artifact.s3.region | quote }}
  HIBOU_ARTIFACT_S3_BUCKET: {{ include "hibou.artifactS3Bucket" . | quote }}
  HIBOU_ARTIFACT_S3_USE_PATH_STYLE: {{ if eq (include "hibou.artifactUsesBundledSeaweedFS" .) "true" }}"true"{{ else }}{{ .Values.artifact.s3.usePathStyle | quote }}{{ end }}
  HIBOU_ARTIFACT_S3_USE_SSL: {{ if eq (include "hibou.artifactUsesBundledSeaweedFS" .) "true" }}"false"{{ else }}{{ .Values.artifact.s3.useSSL | quote }}{{ end }}
  {{- end }}
  HIBOU_TRIVY_URL: {{ include "hibou.trivyURL" . | quote }}
  HIBOU_OSV_URL: {{ .Values.hibou.advisory.osv.url | quote }}
  HIBOU_CACHE_TTL: {{ .Values.hibou.advisory.cache.ttl | quote }}
  HIBOU_MAX_UPLOAD_SIZE: {{ .Values.hibou.maxUploadSize | quote }}
  HIBOU_SHUTDOWN_TIMEOUT: {{ printf "%ds" (int .Values.hibou.shutdown.timeoutSeconds) | quote }}
  HIBOU_BACKGROUND_ARTIFACT_PROCESSING_ENABLED: {{ .Values.hibou.background.artifactProcessing | quote }}
  HIBOU_BACKGROUND_RETENTION_ENABLED: {{ .Values.hibou.background.retention | quote }}
  HIBOU_BACKGROUND_STALE_SCAN_ENABLED: {{ .Values.hibou.background.staleScan | quote }}
  HIBOU_BACKGROUND_STALE_PENDING_ENABLED: {{ .Values.hibou.background.stalePending | quote }}
  {{- /* Worker pods override this via env: the configmap value is the request-serving pod's setting. */}}
  HIBOU_BACKGROUND_SECRET_SCAN_ENABLED: {{ .Values.hibou.background.secretScan | quote }}
  HIBOU_SECRET_SCAN_ENABLED: {{ .Values.hibou.secretScan.enabled | quote }}
  HIBOU_SECRET_SCAN_ON_PUSH: {{ .Values.hibou.secretScan.onPush | quote }}
  {{- if .Values.hibou.secretScan.providers }}
  HIBOU_SECRET_SCAN_PROVIDERS: {{ join "," .Values.hibou.secretScan.providers | quote }}
  {{- end }}
  {{- if .Values.hibou.secretScan.maxRepoMB }}
  HIBOU_SECRET_SCAN_MAX_REPO_MB: {{ .Values.hibou.secretScan.maxRepoMB | quote }}
  {{- end }}
  {{- if .Values.hibou.secretScan.timeout }}
  HIBOU_SECRET_SCAN_TIMEOUT: {{ .Values.hibou.secretScan.timeout | quote }}
  {{- end }}
  {{- if .Values.hibou.cveFeed.remote }}
  HIBOU_CVE_FEED_REMOTE: {{ .Values.hibou.cveFeed.remote | quote }}
  {{- end }}
  HIBOU_CVE_FEED_INTERVAL: {{ .Values.hibou.cveFeed.interval | quote }}
  HIBOU_SECRET_SCAN_TEMP_DIR: {{ .Values.hibou.scratch.mountPath | quote }}
  {{- /* The rootfs is read-only, so /tmp is not writable. git, gitleaks and trufflehog
         all honor TMPDIR, and Go's os.TempDir does too. Always set: the CVE feed sweep
         is not optional, so a pod with nowhere to write would fail every sweep. */}}
  TMPDIR: {{ .Values.hibou.scratch.mountPath | quote }}
  HIBOU_AUTO_PROVISION_ORGS: {{ if hasKey .Values.hibou "autoProvisionOrgs" }}{{ .Values.hibou.autoProvisionOrgs | quote }}{{ else }}"true"{{ end }}
  {{- if .Values.hibou.instanceAdminsExistingSecret }}
  HIBOU_INSTANCE_ADMINS_FILE: "/etc/hibou/instance-admins/emails"
  {{- end }}
  {{- with (include "hibou.baseURL" .) }}
  HIBOU_BASE_URL: {{ . | quote }}
  {{- end }}
  {{- range $i, $forge := .Values.hibou.forges }}
  {{ printf "HIBOU_FORGE_%d_TYPE" $i }}: {{ $forge.type | quote }}
  {{ printf "HIBOU_FORGE_%d_ID" $i }}: {{ $forge.id | default $forge.type | quote }}
  {{- if $forge.url }}
  {{ printf "HIBOU_FORGE_%d_URL" $i }}: {{ $forge.url | quote }}
  {{- end }}
  {{- if $forge.ipAllowlist }}
  {{ printf "HIBOU_FORGE_%d_IP_ALLOWLIST" $i }}: "true"
  {{- end }}
  {{- if $forge.allowedCIDRs }}
  {{ printf "HIBOU_FORGE_%d_ALLOWED_CIDRS" $i }}: {{ $forge.allowedCIDRs | quote }}
  {{- end }}
  {{- if $forge.rateLimitRPS }}
  {{ printf "HIBOU_FORGE_%d_RATE_LIMIT_RPS" $i }}: {{ $forge.rateLimitRPS | quote }}
  {{- end }}
  {{- end }}
