apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "hibou.fullname" . }}
  labels:
    {{- include "hibou.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.hibou.replicas }}
  selector:
    matchLabels:
      {{- include "hibou.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: server
  template:
    metadata:
      labels:
        {{- include "hibou.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: server
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: hibou
          image: {{ printf "%s:%s" .Values.hibou.image.repository .Values.hibou.image.tag | quote }}
          imagePullPolicy: {{ .Values.hibou.image.pullPolicy }}
          args:
            - serve
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ include "hibou.fullname" . }}
            {{- if or .Values.hibou.sessionSecret .Values.hibou.sessionSecretExistingSecret }}
            - secretRef:
                name: {{ .Values.hibou.sessionSecretExistingSecret | default (printf "%s-session" (include "hibou.fullname" $)) }}
            {{- end }}
            {{- range $i, $forge := .Values.hibou.forges }}
            - secretRef:
                name: {{ $forge.existingSecret | default (printf "%s-forge-%d" (include "hibou.fullname" $) $i) }}
            {{- end }}
          env:
            - name: HIBOU_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "hibou.postgresqlSecretName" . }}
                  key: {{ include "hibou.postgresqlSecretKey" . }}
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.hibou.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
