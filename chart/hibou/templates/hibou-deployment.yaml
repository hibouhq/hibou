{{- include "hibou.validateScratchForSecretScan" . -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "hibou.fullname" . }}
  labels:
    {{- include "hibou.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.hibou.replicas }}
  selector:
    matchLabels:
      {{- include "hibou.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: server
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: {{ .Values.hibou.rollingUpdate.maxSurge }}
      maxUnavailable: {{ .Values.hibou.rollingUpdate.maxUnavailable }}
  template:
    metadata:
      labels:
        {{- include "hibou.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: server
    spec:
      terminationGracePeriodSeconds: {{ .Values.hibou.shutdown.terminationGracePeriodSeconds }}
      automountServiceAccountToken: {{ .Values.hibou.automountServiceAccountToken }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      {{- include "hibou.podAntiAffinity" (dict "root" . "component" "server") | nindent 6 }}
      containers:
        - name: hibou
          image: {{ include "hibou.image" . | quote }}
          imagePullPolicy: {{ .Values.hibou.image.pullPolicy }}
          args:
            - serve
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
            {{- if ne (include "hibou.metricsPort" .) "0" }}
            - name: metrics
              containerPort: {{ include "hibou.metricsPort" . }}
              protocol: TCP
            {{- end }}
          envFrom:
            - configMapRef:
                name: {{ include "hibou.fullname" . }}
            - secretRef:
                name: {{ include "hibou.sessionSecretName" . }}
            {{- range $i, $forge := .Values.hibou.forges }}
            - secretRef:
                name: {{ $forge.existingSecret | default (printf "%s-forge-%d" (include "hibou.fullname" $) $i) }}
            {{- end }}
          env:
            {{- with (include "hibou.goMemLimit" (dict "resources" .Values.hibou.resources "percent" .Values.hibou.goMemLimitPercent)) }}
            - name: GOMEMLIMIT
              value: {{ . | quote }}
            {{- end }}
            - name: HIBOU_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "hibou.postgresqlSecretName" . }}
                  key: {{ include "hibou.postgresqlSecretKey" . }}
            {{- if and .Values.hibou.metrics.enabled .Values.hibou.metrics.auth.existingSecret }}
            - name: HIBOU_METRICS_BEARER_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.hibou.metrics.auth.existingSecret }}
                  key: {{ .Values.hibou.metrics.auth.existingSecretKey }}
            {{- end }}
            {{- if eq (include "hibou.artifactBackend" .) "s3" }}
            - name: HIBOU_ARTIFACT_S3_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: {{ include "hibou.artifactS3CredentialsSecretName" . }}
                  key: accessKeyID
            - name: HIBOU_ARTIFACT_S3_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "hibou.artifactS3CredentialsSecretName" . }}
                  key: secretAccessKey
            {{- end }}
          livenessProbe:
            httpGet:
              path: {{ .Values.hibou.probes.liveness.path | quote }}
              port: http
            initialDelaySeconds: {{ .Values.hibou.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.hibou.probes.liveness.periodSeconds }}
            timeoutSeconds: {{ .Values.hibou.probes.liveness.timeoutSeconds | default 1 }}
            failureThreshold: {{ .Values.hibou.probes.liveness.failureThreshold | default 3 }}
          readinessProbe:
            httpGet:
              path: {{ .Values.hibou.probes.readiness.path | quote }}
              port: http
            initialDelaySeconds: {{ .Values.hibou.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.hibou.probes.readiness.periodSeconds }}
          lifecycle:
            preStop:
              exec:
                command:
                  - /bin/sh
                  - -c
                  - sleep {{ .Values.hibou.shutdown.preStopSleepSeconds }}
          resources:
            {{- toYaml .Values.hibou.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            {{- if eq (include "hibou.artifactFilesystemPersistenceEnabled" .) "true" }}
            - name: artifact-filesystem
              mountPath: {{ include "hibou.artifactFilesystemPath" . | quote }}
            {{- end }}
            - name: scratch
              mountPath: {{ .Values.hibou.scratch.mountPath | quote }}
            {{- if .Values.hibou.instanceAdminsExistingSecret }}
            {{- /* Directory mount on purpose: subPath mounts never receive
                   Secret updates, and the server re-reads this file per check
                   so edits apply within the kubelet sync period. */}}
            - name: instance-admins
              mountPath: /etc/hibou/instance-admins
              readOnly: true
            {{- end }}
      volumes:
        {{- if eq (include "hibou.artifactFilesystemPersistenceEnabled" .) "true" }}
        - name: artifact-filesystem
          persistentVolumeClaim:
            claimName: {{ include "hibou.artifactFilesystemPVCName" . }}
        {{- end }}
        - name: scratch
          emptyDir:
            sizeLimit: {{ .Values.hibou.scratch.sizeLimit }}
        {{- if .Values.hibou.instanceAdminsExistingSecret }}
        - name: instance-admins
          secret:
            secretName: {{ .Values.hibou.instanceAdminsExistingSecret }}
        {{- end }}
