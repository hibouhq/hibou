{{- if and .Values.postgresql.enabled (not .Values.postgresql.auth.existingSecret) }}
{{- if not .Values.postgresql.auth.password }}
{{- fail "postgresql.auth.password is required when postgresql.auth.existingSecret is not set. Use --set postgresql.auth.password=<value> or provide an existingSecret." }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "hibou.postgresqlSecretName" . }}
  labels:
    {{- include "hibou.labels" . | nindent 4 }}
type: Opaque
stringData:
  password: {{ .Values.postgresql.auth.password | quote }}
  url: {{ printf "postgres://%s:%s@%s:5432/%s?sslmode=disable" .Values.postgresql.auth.username .Values.postgresql.auth.password (include "hibou.postgresqlServiceName" .) .Values.postgresql.auth.database | quote }}
{{- end }}
