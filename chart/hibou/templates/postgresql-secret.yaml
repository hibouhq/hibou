apiVersion: v1
kind: Secret
metadata:
  name: {{ include "hibou.postgresqlSecretName" . }}
  labels:
    {{- include "hibou.labels" . | nindent 4 }}
type: Opaque
stringData:
  username: {{ .Values.postgresql.auth.username | quote }}
  password: {{ .Values.postgresql.auth.password | quote }}
  database: {{ .Values.postgresql.auth.database | quote }}
  database-url: {{ include "hibou.databaseURL" . | quote }}