{{- if and .Values.postgresql.enabled (not .Values.postgresql.auth.existingSecret) }}
{{- $secretName := include "hibou.postgresqlSecretName" . }}
{{- $existing := (lookup "v1" "Secret" .Release.Namespace $secretName) | default dict }}
{{- $data := get $existing "data" | default dict }}
{{- $password := default (default (randAlphaNum 32) ((get $data "password") | b64dec)) .Values.postgresql.auth.password }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  labels:
    {{- include "hibou.labels" . | nindent 4 }}
type: Opaque
stringData:
  password: {{ $password | quote }}
  url: {{ printf "postgres://%s:%s@%s:5432/%s?sslmode=disable" .Values.postgresql.auth.username $password (include "hibou.postgresqlServiceName" .) .Values.postgresql.auth.database | quote }}
{{- end }}
