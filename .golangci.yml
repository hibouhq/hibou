version: "2"

run:
  # CI runs 5 CPU-heavy jobs concurrently in one shared container (parallel
  # steps) with a cold Go build cache, so golangci-lint gets starved well past
  # the ~2-3m it needs uncontended. 10m gives headroom without masking a hang.
  timeout: 10m

issues:
  max-issues-per-linter: 0
  max-same-issues: 0

linters:
  enable:
    - bodyclose
    - copyloopvar
    - dupword
    - errcheck
    - errorlint
    - gocritic
    - gosec
    - govet
    - ineffassign
    - misspell
    - nolintlint
    - perfsprint
    - revive
    - staticcheck
    - unconvert
    - unused
    - usestdlibvars
    - wastedassign
  settings:
    errcheck:
      check-type-assertions: false
      exclude-functions:
        - (io.Closer).Close
        - (io.ReadCloser).Close
    gocritic:
      disabled-checks:
        - appendAssign
    nolintlint:
      require-specific: true
      require-explanation: true
    revive:
      rules:
        - name: exported
          disabled: true
        - name: package-comments
          disabled: true
        - name: unused-parameter
          disabled: true
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - path: _test\.go
        linters:
          - gosec
    paths:
      - site/
    warn-unused: true

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/hibouhq/hibou
  exclusions:
    generated: lax
    paths:
      - site/
