          belongs to.'
        type: string
      preset:
        type: string
      token_id:
        type: string
      token_name:
        type: string
      token_type:
        type: string
      user:
        type: string
    type: object
  devicelogin.TokenRequest:
    properties:
      client_id:
        type: string
      device_code:
        type: string
      grant_type:
