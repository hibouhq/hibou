    - teams
    - email
    - discord
    type: string
    x-enum-varnames:
    - NotificationDestinationTypeWebhook
    - NotificationDestinationTypeSlack
    - NotificationDestinationTypeTeams
    - NotificationDestinationTypeEmail
    - NotificationDestinationTypeDiscord
  devicelogin.Authorization:
