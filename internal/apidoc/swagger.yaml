          $ref: '#/definitions/sbom.ComponentDelta'
        type: array
      summary:
        $ref: '#/definitions/sbom.SBOMDiffSummary'
      unchanged:
        items:
          $ref: '#/definitions/sbom.ComponentDelta'
        type: array
      version_changed:
        items:
          $ref: '#/definitions/sbom.ComponentDelta'
        type: array
    type: object
  sbom.SBOMDiffSummary:
    properties:
      added:
        type: integer
      removed:
        type: integer
      total_base:
        type: integer
      total_head:
        type: integer
      unchanged:
        type: integer
      version_changed:
        type: integer
    type: object
  scancatalog.Applicability:
    properties:
      build_systems:
        items:
          type: string
        type: array
      extensions:
        items:
          type: string
        type: array
      manifests:
        items:
          type: string
        type: array
    type: object
  scancatalog.Capability:
    properties:
      capability:
        type: string
      evidence:
        type: string
      language:
        type: string
    type: object
  scancatalog.Command:
    properties:
      args:
        items:
          type: string
        type: array
    type: object
  scancatalog.Distribution:
    properties:
      arch:
        type: string
      asset:
        type: string
      coordinates:
        type: string
      kind:
        type: string
      libc:
        type: string
      os:
        type: string
      sha256:
        type: string
      signature:
        $ref: '#/definitions/scancatalog.Signature'
      size:
        type: integer
      url:
        type: string
    type: object
  scancatalog.Location:
    properties:
      scanner_id:
        type: string
