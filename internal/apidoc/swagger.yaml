      timeout_seconds:
        type: integer
    type: object
  scancatalog.Ruleset:
    properties:
      id:
        type: string
      license:
        type: string
      name:
        type: string
      notes:
        type: string
      revision:
        type: string
      source:
        type: string
      status:
        type: string
    type: object
  scancatalog.SARIFTraits:
    properties:
      code_flows:
        type: string
      fingerprint:
        type: string
      paths:
        type: string
    type: object
  scancatalog.Signature:
    properties:
      certificate_url:
        type: string
      kind:
        type: string
      signature_url:
        type: string
    type: object
  scancatalog.Stages:
    properties:
      produces:
        items:
          type: string
        type: array
      requires:
        items:
          type: string
        type: array
    type: object
  scancoverage.Cell:
    properties:
      configured:
        type: string
      enforcement:
        type: string
      last_commit:
        type: string
      last_run_at:
        type: string
      reason:
        type: string
      required:
        type: boolean
      scanner_id:
        type: string
      state:
        type: string
    type: object
  scanplan.Job:
    properties:
      artifact:
        $ref: '#/definitions/scancatalog.Location'
      blocked_reason:
        description: BlockedReason names the exact setup blocker (ADR-035 §5).
        type: string
      capabilities:
        items:
          $ref: '#/definitions/scancatalog.Capability'
        type: array
      command:
        items:
          type: string
        type: array
      exclusions:
        items:
          type: string
        type: array
      id:
        type: string
      prerequisites:
        items:
          type: string
        type: array
      rationale:
        type: string
      resources:
        $ref: '#/definitions/scancatalog.Resources'
      ruleset:
        type: string
      scanner_id:
        type: string
      scope:
        description: Scope is "full" when Targets cover the repository, else "partial".
        type: string
      status:
        type: string
      targets:
        description: Targets are the module roots the job analyses ("." = repository).
        items:
          type: string
        type: array
    type: object
  scanplan.Plan:
    properties:
      applicability_status:
        description: |-
          ApplicabilityStatus "truncated"/"unknown" means the plan may miss
          scopes: coverage built on it is not complete.
        type: string
      base_commit_sha:
        type: string
      catalog_revision:
        type: string
      commit_sha:
        type: string
      detection_revision:
        type: string
      digest:
        type: string
      jobs:
        items:
          $ref: '#/definitions/scanplan.Job'
        type: array
      mode:
        type: string
      mode_reason:
        type: string
      runner:
        $ref: '#/definitions/scanplan.Runner'
    type: object
  scanplan.Runner:
    properties:
      arch:
        type: string
      libc:
        type: string
      os:
        type: string
    type: object
  scanpolicy.Decision:
    properties:
      applicable:
        type: boolean
      exempted:
        items:
          type: string
        type: array
      preview:
        type: boolean
      reason:
        type: string
      repo_mode:
        description: RepoMode is the repo's own setting, shown even when overridden.
        type: string
      requirements:
        items:
          type: string
        type: array
      scanner_id:
        type: string
      source:
        description: 'Source: org-requirement, repo, org-default.'
        type: string
      state:
        type: string
    type: object
  server.addReleaseClientRequest:
    properties:
      client_slug:
        type: string
      environment:
        type: string
      notes:
        type: string
    type: object
  server.assertionDecisionRequest:
    properties:
      reason:
        type: string
    type: object
  server.assertionResponse:
    properties:
