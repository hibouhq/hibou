      - description: Organization slug
        in: path
        name: slug
        required: true
        type: string
      - description: Team slug
        in: path
        name: teamSlug
        required: true
        type: string
      - description: Team updates
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/server.updateTeamRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/api.Response'
            - properties:
                data:
                  $ref: '#/definitions/store.Team'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/api.Response'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/api.Response'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/api.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.Response'
      security:
      - BearerAuth: []
      summary: Update team
      tags:
      - teams
  /orgs/onboardable:
    get:
      description: List forge accounts the authenticated user can onboard into Hibou
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/api.Response'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/orgprovision.OnboardableAccount'
                  type: array
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/api.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.Response'
      security:
      - BearerAuth: []
      summary: List onboardable organizations
      tags:
      - organizations
  /ready:
    get:
      description: Returns server readiness status based on database connectivity
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/api.Response'
            - properties:
                data:
                  $ref: '#/definitions/server.readyResponse'
              type: object
        "503":
          description: Service Unavailable
          schema:
            allOf:
            - $ref: '#/definitions/api.Response'
            - properties:
                data:
                  $ref: '#/definitions/server.readyResponse'
              type: object
      summary: Readiness check
      tags:
      - system
  /scanner-catalog:
    get:
      description: 'The scanners hibou supports in CI (ADR-035): capabilities per
        language with their evidence, pinned artifacts with sha256, and where this
        installation fetches each one (approved location, mirror, offline bundle or
        upstream) under its scanner_distribution policy.'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/api.Response'
            - properties:
                data:
                  $ref: '#/definitions/server.scannerCatalogResponse'
              type: object
      security:
      - BearerAuth: []
      summary: Bundled scanner catalog
      tags:
      - scanners
  /tools/sbom/compare:
    post:
      consumes:
      - application/json
      description: 'The Tools SBOM comparator without a repository: both sides are
        inline documents (base64 CycloneDX or SPDX JSON) the caller sends, so nothing
        stored is read and no repository access is needed. Repository snapshot artifacts
        are compared through the repository''s own endpoint.'
      parameters:
      - description: Inline base and head documents
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/server.compareSBOMsRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/api.Response'
            - properties:
                data:
                  $ref: '#/definitions/sbom.SBOMDiff'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.Response'
      summary: Compare two SBOM files
      tags:
      - tools
  /upload:
    post:
      consumes:
      - application/json
      description: Creates a pending snapshot. Artifact type (SBOM, SARIF, coverage
        report, or VEX document) is auto-detected from content.
      parameters:
      - description: Upload payload
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/server.autoUploadRequest'
      produces:
      - application/json
      responses:
        "202":
          description: Accepted
          schema:
            allOf:
            - $ref: '#/definitions/api.Response'
            - properties:
                data:
                  $ref: '#/definitions/server.uploadResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/api.Response'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/api.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.Response'
      security:
      - BearerAuth: []
      summary: Upload artifact (auto-detect)
      tags:
      - uploads
  /uploads/{id}/status:
    get:
      description: Returns the current status for an upload snapshot.
      parameters:
      - description: Snapshot ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/api.Response'
            - properties:
                data:
                  $ref: '#/definitions/server.uploadStatusResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/api.Response'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/api.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.Response'
      security:
      - BearerAuth: []
      summary: Get upload status
      tags:
      - uploads
  /users/me:
    get:
      description: Returns the authenticated user derived from the API key
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/api.Response'
            - properties:
                data:
                  $ref: '#/definitions/server.meResponse'
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/api.Response'
      security:
      - BearerAuth: []
      summary: Get current user
      tags:
      - users
  /users/me/api-keys:
    get:
      description: List API keys owned by the authenticated user
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/api.Response'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/store.APIKey'
                  type: array
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/api.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.Response'
      security:
      - BearerAuth: []
      summary: List API keys
      tags:
      - api-keys
    post:
      consumes:
      - application/json
      description: Create a new API key for the authenticated user and return the
        raw key once
      parameters:
      - description: API key details
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/server.createAPIKeyRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            allOf:
            - $ref: '#/definitions/api.Response'
            - properties:
                data:
                  $ref: '#/definitions/server.createAPIKeyResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/api.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.Response'
      security:
      - BearerAuth: []
      summary: Create API key
      tags:
      - api-keys
  /users/me/api-keys/{keyID}:
    delete:
      description: Delete an API key owned by the authenticated user
      parameters:
      - description: API key ID
        in: path
        name: keyID
        required: true
        type: string
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/api.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.Response'
      security:
      - BearerAuth: []
      summary: Delete API key
      tags:
      - api-keys
    patch:
      consumes:
      - application/json
      description: Update an API key's name, description, scope, or expiry without
        re-issuing the secret
      parameters:
      - description: API key ID
        in: path
        name: keyID
        required: true
        type: string
      - description: Fields to update
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/server.updateAPIKeyRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/api.Response'
            - properties:
                data:
                  $ref: '#/definitions/store.APIKey'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/api.Response'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/api.Response'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/api.Response'
      security:
      - BearerAuth: []
      summary: Update API key
      tags:
      - api-keys
  /users/me/api-keys/{keyID}/rotate:
    post:
      description: Issues a new secret for an existing API key, keeping its id, scope,
        and audit history. The old secret stops working immediately.
      parameters:
      - description: API key ID
        in: path
        name: keyID
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/api.Response'
            - properties:
                data:
                  $ref: '#/definitions/server.createAPIKeyResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/api.Response'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/api.Response'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/api.Response'
      security:
      - BearerAuth: []
      summary: Rotate API key
      tags:
      - api-keys
  /users/me/api-keys/current:
    delete:
      description: Delete the user-owned API key that authenticates this request (ADR-043
        §6, used by `hibou logout`). The only key-management action allowed with token
        auth; it can reach no other key.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.Response'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.Response'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/api.Response'
      security:
      - BearerAuth: []
      summary: Revoke the calling token
      tags:
      - api-keys
  /users/me/search-presets:
