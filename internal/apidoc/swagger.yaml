      id:
        type: string
      ip_address:
        type: string
      resource_id:
        type: string
      resource_type:
        type: string
    type: object
  server.autoUploadRequest:
    properties:
      artifact:
        $ref: '#/definitions/server.uploadArtifact'
      base_commit_sha:
        type: string
      build_url:
        type: string
      commit_sha:
        type: string
      complete:
        type: boolean
      config_digest:
        type: string
      expect:
        type: integer
      merge_commit_sha:
        description: |-
          Commit provenance (PLAN §2): on pull_request builds, CommitSHA is the PR
          head; these carry the ephemeral merge commit CI checked out and the base
          commit that merge used.
        type: string
      org:
        type: string
      paths:
        items:
          type: string
        type: array
      plan_id:
        description: |-
          PlanID / PlanJobID bind the report to the scan plan job that produced
          it (ADR-035 §4); the job's planned scope becomes the declared scope.
        type: string
      plan_job_id:
        type: string
      pr_number:
        type: string
      pr_source_branch:
        type: string
      pr_target_branch:
        type: string
      pr_title:
        type: string
      provider:
        type: string
      ref:
        type: string
      repo:
        type: string
      run_attempt:
        type: string
      run_id:
        type: string
      run_number:
        type: string
      scope:
        description: |-
          Run declaration (ADR-034 §2): what the producer covered. scope is
          "full" or "partial"; paths lists what a partial run analysed. SARIF
          values (tool.driver.version) win over tool_version.
        type: string
      tag:
        type: string
      tool:
        type: string
      tool_version:
        type: string
    type: object
  server.batchAcceptanceRequest:
    properties:
      expires_at:
        type: string
      fingerprints:
        description: |-
          Fingerprints identify the findings; decisions are fingerprint-keyed so they
          survive snapshot churn, same as the single-finding endpoint.
        items:
          type: string
        type: array
      labels:
        items:
          type: string
        type: array
      reason:
        type: string
      reason_kind:
        type: string
      status:
        description: 'Status: "accepted" | "open"; ReasonKind required on accept (ADR-023).'
        type: string
    type: object
  server.batchAcceptanceResponse:
    properties:
      applied:
        type: integer
      skipped:
        description: |-
          Skipped counts fingerprints that do not belong to this repository, so a
          partial apply is never silent.
        type: integer
      status:
        type: string
    type: object
  server.bulkScannerChange:
    properties:
      from:
        type: string
      repo_id:
        type: string
      repo_slug:
        type: string
    type: object
  server.bulkScannerSettingRequest:
    properties:
      dry_run:
        description: DryRun returns the repositories that would change without changing
          them.
        type: boolean
      mode:
        type: string
      scanner_id:
        type: string
    type: object
  server.bulkScannerSettingResponse:
    properties:
      applied:
        type: boolean
      changes:
        items:
          $ref: '#/definitions/server.bulkScannerChange'
        type: array
      kept:
        description: |-
          Kept are repositories left alone: disabling a scanner the org
          requires needs an exception, not a bulk action.
        items:
          $ref: '#/definitions/server.bulkScannerChange'
        type: array
    type: object
  server.clientImpactResponse:
    properties:
      vulnerabilities:
        items:
          $ref: '#/definitions/server.clientImpactVulnerabilityResponse'
        type: array
    type: object
  server.clientImpactVulnerabilityResponse:
    properties:
      canonical_id:
        type: string
      component_name:
        type: string
      release_version:
        type: string
      severity:
        type: string
    type: object
  server.clientListItemResponse:
    properties:
      active_version:
        type: string
      client_type:
        type: string
      contact_email:
        type: string
      contact_name:
        type: string
      created_at:
        type: string
      deployments_count:
        type: integer
      id:
        type: string
      labels:
        items:
          type: integer
        type: array
      last_deployment_at:
        type: string
      metadata:
        items:
          type: integer
        type: array
      name:
        type: string
      notification_prefs:
        items:
          type: integer
        type: array
      org_id:
        type: string
      slug:
        type: string
      updated_at:
        type: string
    type: object
  server.compareSBOMsRequest:
    properties:
      base_artifact_id:
        type: string
      base_content:
        type: string
      base_format:
        type: string
      head_artifact_id:
        type: string
      head_content:
        type: string
      head_format:
        type: string
    type: object
  server.coverageSourceLine:
    properties:
      branches_covered:
        description: |-
          branches_valid == 0 means no branch on the line. A hit line with
          branches_covered < branches_valid renders as partially covered.
        type: integer
      branches_valid:
        type: integer
      hits:
        type: integer
      is_new:
        description: |-
          IsNew marks a line this comparison changed (ADR-019), present only when
          the request supplies ?base=<ref>. Omitted otherwise, so the plain snapshot
          view is byte-identical to before.
        type: boolean
      number:
        type: integer
    type: object
  server.coverageSourceResponse:
    properties:
      commit_sha:
        type: string
      content:
        type: string
      lines:
        items:
          $ref: '#/definitions/server.coverageSourceLine'
        type: array
      path:
        type: string
    type: object
  server.createAPIKeyRequest:
    properties:
      description:
        type: string
      expires_at:
        type: string
      name:
        type: string
      scopes:
        items:
          type: integer
        type: array
    type: object
  server.createAPIKeyResponse:
    properties:
      api_key:
        $ref: '#/definitions/store.APIKey'
      key:
        type: string
    type: object
  server.createClientRequest:
    properties:
      client_type:
        type: string
      contact_email:
        type: string
      contact_name:
        type: string
      labels:
        additionalProperties:
          type: string
        type: object
      metadata:
        items:
          type: integer
        type: array
      name:
        type: string
      notification_prefs:
        items:
          type: integer
        type: array
      slug:
        type: string
    type: object
  server.createDeploymentRequest:
    properties:
      deployed_at:
        type: string
      deployed_by:
        type: string
      environment:
        type: string
      notes:
        type: string
      release_id:
        type: string
      rollback_target_id:
        type: string
      status:
        type: string
    type: object
  server.createFindingRequest:
    properties:
      cwes:
        description: |-
          CWEs classify the finding (ADR-037) in any spelling the normalizer
          accepts ("CWE-89", "89"). Unlike scanner claims they must exist in the
          CWE catalog: typed or agent-generated input is validated.
        items:
          type: string
        type: array
      description:
        type: string
      end_line:
        type: integer
      file_path:
        type: string
      ref:
        description: |-
          Ref selects the branch whose latest snapshot the finding attaches to.
          Defaults to the repository's default branch.
        type: string
      rule_id:
        description: RuleID is the caller's identifier for what was found ("manual/sql-injection").
        type: string
      severity:
        type: string
      solution:
        type: string
      start_line:
        type: integer
      title:
        type: string
    type: object
  server.createIntegrationRequest:
    properties:
      config:
        items:
          type: integer
        type: array
      enabled:
        type: boolean
      integration_type:
        type: string
      name:
        type: string
    type: object
  server.createNotificationRuleRequest:
    properties:
      conditions:
        items:
          type: integer
        type: array
      destination_config:
        items:
          type: integer
        type: array
      destination_type:
        type: string
      enabled:
        type: boolean
      event_type:
        type: string
      name:
        type: string
    type: object
  server.createOrgAPIKeyRequest:
    properties:
      description:
        type: string
      expires_at:
        type: string
      name:
        type: string
      scopes:
        items:
          type: integer
        type: array
    type: object
  server.createOrgRequest:
    properties:
      display_name:
        type: string
      name:
        type: string
      provider:
        type: string
      slug:
        type: string
    type: object
  server.createQualityGateRequest:
    properties:
      description:
        type: string
      enabled:
        type: boolean
      finding_severities:
        items:
          type: integer
        type: array
      max_critical:
        type: integer
      max_high:
        type: integer
      max_medium:
        type: integer
      max_new_findings:
        type: integer
      name:
        type: string
      repo_id:
        type: string
    type: object
  server.createScanPlanRequest:
    properties:
      base_commit_sha:
        type: string
      commit_sha:
        type: string
      dry_run:
        description: DryRun returns the plan without storing it (UI preview).
        type: boolean
      mode:
        description: Mode "" lets hibou choose (baseline or full); "sweep" asks for
          one.
        type: string
      ref:
        type: string
      runner:
        $ref: '#/definitions/scanplan.Runner'
      scanners:
        description: |-
          Scanners selects catalog scanners explicitly, including pre-releases;
          empty means every applicable, non-preview scanner. Repo and org
          policy (ADR-035 §5) will narrow this.
        items:
          type: string
        type: array
    type: object
  server.createSearchPresetRequest:
    properties:
      name:
        type: string
      query:
        type: string
      surface:
        type: string
    type: object
  server.createTeamRequest:
    properties:
      name:
        type: string
      slug:
        type: string
    type: object
  server.cweCatalogEntryResponse:
    properties:
      abstraction:
        type: string
      ancestors:
        description: |-
          Ancestors are the View 1000 parents, nearest first: what a cwe-tree:
          query would have to name to include this CWE.
        items:
          type: integer
        type: array
      category:
        $ref: '#/definitions/cwe.SetRef'
      deprecated:
        type: boolean
      descendants:
        description: |-
          Descendants counts the View 1000 entries under this one, so a
          cwe-tree: suggestion can say how much it covers.
        type: integer
      id:
        type: integer
      name:
        type: string
      sets:
        items:
          $ref: '#/definitions/cwe.SetRef'
        type: array
    type: object
  server.cweCatalogResponse:
    properties:
      entries:
        items:
          $ref: '#/definitions/server.cweCatalogEntryResponse'
        type: array
      version:
        type: string
    type: object
  server.cweSetResponse:
    properties:
      kind:
        type: string
      member_count:
        type: integer
      name:
        type: string
      slug:
        type: string
    type: object
  server.cweSetsResponse:
    properties:
      categories:
        items:
          $ref: '#/definitions/server.cweSetResponse'
        type: array
      sets:
        items:
          $ref: '#/definitions/server.cweSetResponse'
        type: array
      version:
        type: string
    type: object
  server.decideExceptionRequest:
    properties:
      approve:
        type: boolean
    type: object
  server.deploymentResponse:
    properties:
      client_id:
        type: string
      created_at:
        type: string
      deployed_at:
        type: string
      deployed_by:
        type: string
      environment:
        type: string
      id:
        type: string
      notes:
        type: string
      release_id:
        type: string
      release_version:
        type: string
      rollback_target_id:
        type: string
      status:
        $ref: '#/definitions/store.DeploymentStatus'
    type: object
  server.deviceDecisionRequest:
    properties:
      expires_at:
        type: string
      preset:
        type: string
      user_code:
        type: string
    type: object
  server.deviceOrgReachView:
    properties:
      effective_role:
        type: string
      name:
        type: string
      policy:
        type: string
      provider:
        type: string
      role:
        type: string
      slug:
        type: string
    type: object
  server.devicePresetView:
    properties:
      key:
        type: string
      permissions:
        additionalProperties:
          $ref: '#/definitions/apitoken.AccessLevel'
        type: object
    type: object
  server.deviceRequestView:
    properties:
      client_id:
        type: string
      client_label:
        type: string
      client_name:
        type: string
      created_at:
        type: string
      default_expires_at:
        type: string
      expires_at:
        type: string
      max_expires_at:
        type: string
      orgs:
        items:
          $ref: '#/definitions/server.deviceOrgReachView'
        type: array
      presets:
        items:
          $ref: '#/definitions/server.devicePresetView'
        type: array
      requested_preset:
        type: string
      requester_ip:
        type: string
      user_code:
        type: string
    type: object
  server.effectiveConfigResponse:
    properties:
      branch:
        description: |-
          Branch the resolution was done for. Gate selection is branch-dependent, so
          an effective config without a branch is meaningless.
        type: string
      config_present:
        type: boolean
      enforcement:
        type: string
      enforcement_source:
        type: string
      file_gate_branches:
        items:
          type: string
        type: array
      file_gate_matched:
        description: |-
          FileGateMatched is false when no `.hibou.yaml` gate covers this branch —
          in which case only DB gates and unconditional rules apply.
        type: boolean
      file_unavailable:
        description: |-
          FileUnavailable distinguishes "the file has no gates" from "we could not
          read the file" — collapsing those two would report an unknown as an
          absence.
        type: boolean
      gate_source:
        description: |-
          GateSource says where the DB thresholds came from, since inheriting the
          org's gates is indistinguishable from having your own until you are told.
        type: string
      sections:
        items:
          $ref: '#/definitions/server.effectiveSection'
        type: array
      warnings:
        description: |-
