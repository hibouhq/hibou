host: localhost:8585
info:
  contact: {}
  description: DevSecOps security platform API
  title: hibou API
  version: "1.0"
paths:
  /auth/callback:
    get:
      description: Exchanges the OAuth callback code, upserts the user, sets the session
        cookie, and redirects home
      parameters:
      - description: Provider ID
        in: query
        name: provider
        required: true
        type: string
      - description: OAuth authorization code
        in: query
        name: code
        required: true
        type: string
      - description: OAuth state
        in: query
        name: state
        required: true
        type: string
      responses:
        "302":
          description: Found
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.Response'
      summary: Handle login callback
      tags:
      - auth
  /auth/dev-login:
    post:
      description: Creates or fetches a local admin user for development. Only available
        when no forge providers are configured.
      produces:
      - application/json
      responses:
        "302":
          description: Found
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/api.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.Response'
      summary: Dev login
      tags:
      - auth
  /auth/login:
    get:
      description: Redirects the caller to the selected OAuth provider login flow
      parameters:
      - description: Provider ID
        in: query
        name: provider
        required: true
        type: string
      responses:
        "302":
          description: Found
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.Response'
      summary: Begin login
      tags:
      - auth
  /auth/logout:
    post:
      description: Clears the current session cookie
      responses:
        "204":
          description: No Content
      summary: Logout
      tags:
      - auth
  /auth/providers:
    get:
      description: Returns the configured authentication providers
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/api.Response'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/auth.providerResponse'
                  type: array
              type: object
      summary: List auth providers
      tags:
      - auth
  /health:
    get:
      description: Returns server health status
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/api.Response'
            - properties:
                data:
                  $ref: '#/definitions/server.healthResponse'
              type: object
      summary: Health check
      tags:
