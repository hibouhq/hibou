  store.Vulnerability:
    properties:
      acceptance:
        allOf:
        - $ref: '#/definitions/store.VulnerabilityAcceptance'
        description: |-
          Acceptance is the ADR-023 decision projection, joined server-side in the
          list queries. Nil = open.
      advisory_id:
        type: string
      affected_range_id:
        type: string
      author_email:
        type: string
      commit_sha:
        type: string
      component_id:
        type: string
      component_name:
        type: string
      component_purl:
        type: string
      component_version:
        type: string
      confidence:
        type: string
      consecutive_absences:
        type: integer
      created_at:
        type: string
      created_by:
        type: string
      cvss:
        allOf:
        - $ref: '#/definitions/store.CVSSScore'
        description: |-
          CVSS is the rating the finding uses and RatedBy who gave it (ADR-038
          §2): for an OS package, its distro's own rating. Copied like severity.
      cwes:
        description: |-
          CWEs every source attributes to the finding (ADR-037): rule, advisory,
          SARIF result taxa, a manual declaration, or the finding type. Attached
          per page through the finding_cwes view — never a column.
        items:
          $ref: '#/definitions/store.FindingCWE'
        type: array
      description:
        type: string
      detected_at:
        type: string
      dispute:
        allOf:
        - $ref: '#/definitions/store.VulnerabilityDispute'
        description: |-
          Dispute is the ADR-026 override projection: someone contested this
          finding's in-source suppression, so it counts as open despite the
          scanner's suppressed status. Nil = suppression uncontested.
      due_date:
        type: string
      ecosystem:
        type: string
      end_line:
        type: integer
      epss:
        allOf:
        - $ref: '#/definitions/store.EPSSScore'
        description: |-
          EPSS, RatingsDisagree and Ratings are attached per page (ADR-038 §6).
          Ratings lists every rater; list rows carry it only when they disagree,
          the hover behind the list's marker.
      file_path:
        type: string
      fingerprint:
        type: string
      first_seen_at:
        type: string
      fixed_in_prs:
        description: |-
          FixedInPRs lists open pull requests whose latest gate run resolves this
          fingerprint — it changes the triage decision ("merge #12 instead of
          accepting"). Attached by the list/detail handlers, never stored.
        items:
          $ref: '#/definitions/store.FixingPullRequest'
        type: array
      has_remediation:
        type: boolean
      id:
        type: string
      kev:
        description: |-
          KEV marks the finding's advisory as listed on a known-exploited catalog
          (PLAN §3). Enriched per page after the query, like FixedInPRs — never a
          column.
        type: boolean
      language:
        type: string
      last_seen_at:
        type: string
      last_seen_commit:
        type: string
      last_seen_snapshot_id:
        type: string
      location_hash:
        type: string
      metadata:
        items:
          type: integer
        type: array
      origin:
        type: string
      origin_api_key_id:
        type: string
      origin_owner_id:
        type: string
      origin_owner_type:
        type: string
      origin_token_name:
        type: string
      original_severity:
        $ref: '#/definitions/store.SeverityLevel'
      presence:
        description: |-
          Presence (ADR-034 §3): "reported" when the producer reported the
          finding in this snapshot; "not_rechecked" / "unconfirmed" when the row
          was carried forward because nothing re-checked it. Still open either way.
        type: string
      presence_reason:
        type: string
      present_on_default_branch:
        type: boolean
      primary_identifier_kind:
        type: string
      primary_identifier_value:
        type: string
      rated_by:
        type: string
      ratings:
        items:
          $ref: '#/definitions/store.FindingRating'
        type: array
      ratings_disagree:
        type: boolean
      reachability:
        type: string
      remediation_link:
        type: string
      resolution_reason:
        description: |-
          ResolutionReason is set on a delta's resolved findings only (not
          stored): fixed, file_removed, no_longer_reported, producer_changed.
          Only the first two are fixes a PR can claim (ADR-034 §6).
        type: string
      resolved_at:
        type: string
      resolved_by:
        type: string
      resolved_on_default_branch:
        type: boolean
      scanner_external_id:
        type: string
      scanner_name:
        type: string
      scanner_vendor:
        type: string
      scanner_version:
        type: string
      secret_type:
        type: string
      severity:
        $ref: '#/definitions/store.SeverityLevel'
      severity_override_by:
        type: string
      severity_override_reason:
        type: string
      snapshot_id:
        type: string
      solution:
        type: string
      start_line:
        type: integer
      state_comment:
        type: string
      status:
        type: string
      title:
        type: string
      type:
        type: string
      updated_at:
        type: string
      verified:
        type: boolean
    type: object
  store.VulnerabilityAcceptance:
    properties:
      accepted_by:
        type: string
      created_at:
        type: string
      expires_at:
        type: string
      labels:
        items:
          type: string
        type: array
      reason:
        type: string
      reason_kind:
        type: string
      vex_justification:
        type: string
    type: object
  store.VulnerabilityDispute:
    properties:
      created_at:
        type: string
      reason:
        type: string
    type: object
  uuid.NullUUID:
    properties:
      uuid:
        type: string
      valid:
        description: Valid is true if UUID is not NULL
        type: boolean
    type: object
host: localhost:8585
info:
  contact: {}
  description: DevSecOps security platform API
  title: hibou API
  version: "1.0"
paths:
  /auth/callback:
    get:
      description: Exchanges the OAuth callback code, upserts the user, sets the session
        cookie, and redirects home
      parameters:
      - description: Provider ID
        in: query
        name: provider
        required: true
        type: string
      - description: OAuth authorization code
        in: query
        name: code
        required: true
        type: string
      - description: OAuth state
        in: query
        name: state
        required: true
        type: string
      responses:
        "302":
          description: Found
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.Response'
      summary: Handle login callback
      tags:
      - auth
  /auth/dev-login:
    post:
      description: Creates or fetches a local admin user for development. Only available
        in development mode with no forge providers configured.
      produces:
      - application/json
      responses:
        "302":
          description: Found
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/api.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.Response'
      summary: Dev login
      tags:
      - auth
  /auth/device:
    get:
      description: Show a pending device login to the signed-in user before they approve
        it (ADR-043). Browser session only.
      parameters:
      - description: Code shown in the terminal (XXXX-XXXX)
        in: query
        name: user_code
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/api.Response'
            - properties:
                data:
                  $ref: '#/definitions/server.deviceRequestView'
              type: object
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/api.Response'
      summary: Look up a device login
      tags:
      - auth
  /auth/device/approve:
    post:
      consumes:
      - application/json
      description: Approve a pending device login with a preset and expiry (ADR-043).
        The client's next poll receives a membership-wide token. Browser session only.
      parameters:
      - description: Code, preset and expiry
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/server.deviceDecisionRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.Response'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.Response'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/api.Response'
      summary: Approve a device login
      tags:
      - auth
  /auth/device/code:
    post:
      consumes:
      - application/json
      description: RFC 8628 device authorization request (ADR-043). Returns a device
        code for the client to poll with and a user code to approve at verification_uri.
        Unauthenticated; the response is RFC 8628 JSON, not the api.Response envelope.
      parameters:
      - description: Client and requested preset
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/devicelogin.CodeRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/devicelogin.Authorization'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/devicelogin.ErrorResponse'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/devicelogin.ErrorResponse'
      summary: Start a device login
      tags:
      - auth
  /auth/device/deny:
    post:
      consumes:
      - application/json
      description: Deny a pending device login (ADR-043). The client's next poll gets
        access_denied. Browser session only.
      parameters:
      - description: Code
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/server.deviceDecisionRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.Response'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/api.Response'
      summary: Deny a device login
      tags:
      - auth
  /auth/device/token:
    post:
      consumes:
      - application/json
      description: RFC 8628 device access token request (ADR-043). Answers authorization_pending
        until the user approves, then returns a membership-wide API token exactly
        once. Unauthenticated; RFC 8628 JSON.
      parameters:
      - description: Device code
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/devicelogin.TokenRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/devicelogin.Token'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/devicelogin.ErrorResponse'
      summary: Poll a device login
      tags:
      - auth
  /auth/login:
    get:
      description: Redirects the caller to the selected OAuth provider login flow
      parameters:
      - description: Provider ID
        in: query
        name: provider
        required: true
        type: string
      responses:
        "302":
          description: Found
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.Response'
      summary: Begin login
      tags:
      - auth
  /auth/logout:
    post:
      description: Revokes every session of the current user and clears the session
        cookie
      responses:
        "204":
          description: No Content
      summary: Logout
      tags:
      - auth
  /auth/providers:
    get:
      description: Returns the configured authentication providers
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/api.Response'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/auth.providerResponse'
                  type: array
              type: object
      summary: List auth providers
      tags:
      - auth
  /cwe:
    get:
      description: 'Embedded MITRE CWE catalog lookup for completion and hover: ids=79,89
        resolves titles in one call; q=sql matches ids and titles. Reference data
        only — no tenant data — so any authenticated caller may use it. The response
        is stable for a catalog version and cacheable.'
      parameters:
      - description: Id (79, CWE-79) or title fragment
        in: query
        name: q
        type: string
      - description: Comma-separated ids to resolve
        in: query
        name: ids
        type: string
      - description: Maximum results for q (default 20, max 100)
        in: query
        name: limit
        type: integer
      - description: 'Without q/ids: list entries of these abstractions (pillar,class)'
        in: query
        name: abstraction
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/api.Response'
            - properties:
                data:
                  $ref: '#/definitions/server.cweCatalogResponse'
              type: object
      security:
      - BearerAuth: []
      summary: Search the CWE catalog
      tags:
      - cwe
  /cwe/sets:
    get:
      description: 'The named sets cwe-set: accepts (CWE Top 25, OWASP Top 10 and
        its categories) and the MITRE View 1400 categories cwe-category: accepts,
        with the catalog edition in each name.'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/api.Response'
            - properties:
                data:
                  $ref: '#/definitions/server.cweSetsResponse'
              type: object
      security:
      - BearerAuth: []
      summary: CWE named sets and categories
      tags:
      - cwe
  /health:
    get:
      description: Returns server health status
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/api.Response'
            - properties:
                data:
                  $ref: '#/definitions/server.healthResponse'
              type: object
      summary: Health check
      tags:
      - system
  /instance/audit-logs:
    get:
      description: 'Audit log entries across the whole instance: every organization
        plus instance-level events (org-less rows). Instance admins only.'
      parameters:
      - description: Action filter
        in: query
        name: action
        type: string
      - description: Resource type filter
        in: query
        name: resource_type
        type: string
      - description: '''instance'' limits to instance-level (org-less) entries'
        in: query
        name: scope
        type: string
      - description: Organization ID; limits entries to that organization
        in: query
        name: org
        type: string
      - description: Page number
        in: query
        name: page
        type: integer
      - description: Items per page
        in: query
        name: per_page
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/api.ListResponse'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/server.instanceAuditLogEntryResponse'
                  type: array
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/api.Response'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/api.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.Response'
      security:
      - BearerAuth: []
      summary: Instance audit logs
      tags:
      - instance
  /instance/banners:
    get:
      description: Enabled instance-wide announcement banners, shown at the top of
        every page (login included).
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/api.Response'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/store.AnnouncementBanner'
                  type: array
              type: object
      summary: Active announcement banners
      tags:
      - instance
  /instance/jobs/overview:
    get:
      description: Per-kind queue counters and the worker fleet. Instance admins only.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/api.Response'
            - properties:
                data:
                  $ref: '#/definitions/server.instanceJobsOverviewResponse'
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/api.Response'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/api.Response'
      security:
      - BearerAuth: []
      summary: Instance jobs overview
      tags:
      - instance
  /instance/jobs/stats:
    get:
      description: Bucketed throughput and latency percentiles plus the trailing-7-day
        baseline. Instance admins only.
      parameters:
      - description: 'Window: 1h, 6h, 24h (default) or 7d'
        in: query
        name: window
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/api.Response'
            - properties:
                data:
                  $ref: '#/definitions/server.instanceJobsStatsResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/api.Response'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/api.Response'
      security:
      - BearerAuth: []
      summary: Instance jobs statistics
      tags:
      - instance
  /instance/jobs/timeline:
    get:
      description: Job runs overlapping the window, newest first, row-capped. Instance
        admins only.
      parameters:
      - description: 'Window: 1h, 6h, 24h (default) or 7d'
        in: query
        name: window
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/api.Response'
            - properties:
                data:
                  $ref: '#/definitions/server.instanceJobsTimelineResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/api.Response'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/api.Response'
      security:
      - BearerAuth: []
      summary: Instance jobs timeline
      tags:
      - instance
  /instance/settings/admins:
    get:
      description: The current instance-admin email list, resolved live from its managed
        source (Secret-mounted file or env). Instance admins only.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/api.Response'
            - properties:
                data:
                  items:
                    type: string
                  type: array
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/api.Response'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/api.Response'
      security:
      - BearerAuth: []
      summary: Instance administrators
      tags:
      - instance
  /instance/settings/banners:
    get:
      description: Full banner list, enabled or not. Instance admins only.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/api.Response'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/store.AnnouncementBanner'
                  type: array
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/api.Response'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/api.Response'
      security:
      - BearerAuth: []
      summary: Announcement banner settings
      tags:
      - instance
    put:
      consumes:
      - application/json
      description: Replaces the full banner list. Instance admins only.
      parameters:
      - description: Banner list
        in: body
        name: request
        required: true
        schema:
          items:
            $ref: '#/definitions/store.AnnouncementBanner'
          type: array
      produces:
      - application/json
      responses:
        "200":
          description: OK
