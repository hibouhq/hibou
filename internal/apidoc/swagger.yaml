      description: List the authenticated user's saved filter-bar queries for one
        surface
      parameters:
      - description: Filter bar surface
        enum:
        - findings
        in: query
        name: surface
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/api.Response'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/server.searchPreset'
                  type: array
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/api.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.Response'
      security:
      - BearerAuth: []
      summary: List search presets
      tags:
      - search-presets
    post:
      consumes:
      - application/json
      description: Save a filter-bar query under a name unique (case-insensitively)
        per user and surface
      parameters:
      - description: Preset
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/server.createSearchPresetRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            allOf:
            - $ref: '#/definitions/api.Response'
            - properties:
                data:
                  $ref: '#/definitions/server.searchPreset'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/api.Response'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/api.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.Response'
      security:
      - BearerAuth: []
      summary: Create search preset
      tags:
      - search-presets
  /users/me/search-presets/{presetID}:
    delete:
      description: Delete one of the authenticated user's presets
      parameters:
      - description: Preset ID
        in: path
        name: presetID
        required: true
        type: string
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/api.Response'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/api.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.Response'
      security:
      - BearerAuth: []
      summary: Delete search preset
      tags:
      - search-presets
    put:
      consumes:
      - application/json
      description: Rename or replace the query of one of the authenticated user's
        presets
      parameters:
      - description: Preset ID
        in: path
        name: presetID
        required: true
        type: string
      - description: Preset
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/server.updateSearchPresetRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/api.Response'
            - properties:
                data:
                  $ref: '#/definitions/server.searchPreset'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/api.Response'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/api.Response'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/api.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.Response'
      security:
      - BearerAuth: []
      summary: Update search preset
      tags:
      - search-presets
  /webhooks/{provider}:
    post:
      consumes:
      - application/json
      description: Validates and records forge webhook updates for refs and pull requests.
      parameters:
      - description: Forge provider ID
        in: path
        name: provider
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/api.Response'
            - properties:
                data:
                  $ref: '#/definitions/server.webhookResponse'
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/api.Response'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/api.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.Response'
      summary: Receive forge webhook
      tags:
      - webhooks
securityDefinitions:
  BearerAuth:
    description: Enter your API key with the "Bearer " prefix
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
